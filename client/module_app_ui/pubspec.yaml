name: sesori_app_ui
description: Shared adaptive Flutter UI foundations for Sesori product shells.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.4
  flutter: ">=3.47.5 <3.48.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_svg: ^2.3.0
  go_router: ^18.0.1
  intl: any
  liquid_glass_widgets: 1.6.2
  markdown: ^7.3.1
  material_ui: ^1.3.0
  path: any
  re_highlight: ^0.0.3
  rxdart: ^0.28.0
  sesori_dart_core:
    path: ../module_core
  sesori_shared:
    path: ../../shared/sesori_shared
  theme_prego:
    path: ../module_prego
  vector_graphics: ^1.2.3

dev_dependencies:
  bloc_test: ^10.0.0
  cupertino_ui: ^1.1.0
  flutter_test:
    sdk: flutter
  get_it: ^9.3.0
  http: ^1.6.0
  mocktail: ^1.0.5
  no_slop_linter:
    path: "../../shared/no_slop_linter"

flutter:
  generate: true
  assets:
    - assets/images/
    - assets/images/bkg_webp/
