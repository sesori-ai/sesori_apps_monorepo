name: sesori_app_ui
description: Shared adaptive Flutter UI foundations for Sesori product shells.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0 <3.51.0"

dependencies:
  clock: ^1.1.3
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_svg: ^2.3.4
  go_router: ^18.1.4
  intl: any
  liquid_glass_widgets: 1.17.2
  markdown: ^7.3.1
  material_ui: ^1.11.0
  pasteboard: ^0.6.0
  path: any
  path_provider: ^2.1.6
  pdfrx: ^2.12.1
  re_highlight: ^0.0.3
  record: ^7.2.0
  rxdart: ^0.28.0
  sesori_dart_core:
    path: ../module_core
  sesori_shared:
    path: ../../shared/sesori_shared
  share_plus: ^13.3.1
  theme_prego:
    path: ../module_prego
  universal_platform: ^1.1.0
  vector_graphics: ^1.3.1
  wakelock_plus: ^1.8.2
  webview_flutter: ^4.14.1

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  get_it: ^9.3.0
  http: ^1.6.0
  mocktail: ^1.0.5
  webview_flutter_platform_interface: ^2.15.1

flutter:
  generate: true
  assets:
    - assets/images/
    - assets/images/bkg_webp/
