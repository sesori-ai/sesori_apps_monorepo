name: sesori_desktop_core
description: Desktop business logic for Sesori — bridge supervision, control-channel orchestration, desktop cubits. Pure Dart, no Flutter dependency.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.1

dependencies:
  bloc: ^9.2.1
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  injectable: ^3.0.0
  meta: ^1.18.0
  rxdart: ^0.28.0
  sesori_dart_core:
    path: ../module_core
  sesori_shared:
    path: ../../shared/sesori_shared

dev_dependencies:
  no_slop_linter:
    path: "../../shared/no_slop_linter"
  build_runner: ^2.16.0
  freezed: 4.0.0-dev.3
  injectable_generator: ^3.1.2
  mocktail: ^1.0.5
  test: ^1.31.0
