name: sesori_client_workspace
publish_to: none

environment:
  sdk: ^3.13.0-0
  flutter: ">=3.47.0 <3.48.0"

workspace:
  - app
  - module_core
  - module_auth
  - module_prego
  - module_desktop_core
  - desktop

dependency_overrides:
  # Freezed 4.0.0-dev.3 still caps analyzer below 14, while lean_builder 1.2.1
  # otherwise selects the analyzer 14 frontend despite having unchanged code.
  _fe_analyzer_shared: 103.0.0
  record_android:
    git:
      url: https://github.com/sesori-ai/record.git
      ref: 98dc1e1a856186e613523aaac06264984bedda87
      path: record_android
