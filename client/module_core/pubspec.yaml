name: sesori_dart_core
description: Core business logic for Sesori — pure Dart, no Flutter dependency.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.2

dependencies:
  bloc: ^9.2.1
  collection: ^1.19.1
  diff_match_patch: ^0.4.1
  cryptography: ^2.9.0
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  http: ^1.6.0
  injectable: ^3.0.0
  json_annotation: ^4.12.0
  meta: ^1.19.0
  mocktail: ^1.0.5
  path: any
  rxdart: ^0.28.0
  sesori_auth:
    path: ../module_auth
  sesori_shared:
    path: ../../shared/sesori_shared
  web_socket_channel: ^3.0.3

dev_dependencies:
  no_slop_linter:
    path: "../../shared/no_slop_linter"
  bloc_test: ^10.0.0
  build_runner: ^2.16.0
  freezed: 4.0.0-dev.3
  injectable_generator: ^3.1.3
  json_serializable: ^6.14.1
  test: ^1.31.1
  fake_async: ^1.3.3
