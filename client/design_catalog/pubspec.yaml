name: sesori_design_catalog
description: Interactive catalog for Sesori Flutter design-system components.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0-0
  flutter: ">=3.47.0 <3.48.0"

dependencies:
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  material_ui: ^1.0.0
  theme_prego:
    path: ../module_prego
  web: ^1.1.1
  widgetbook: 3.25.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  no_slop_linter:
    path: ../../shared/no_slop_linter

flutter:
  uses-material-design: true
