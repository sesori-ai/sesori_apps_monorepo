name: sesori_bridge
description: Dart implementation of the Sesori Bridge CLI for WebSocket communication.
version: 1.8.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.1

dependencies:
  args: ^2.7.0
  cryptography: ^2.9.0
  web_socket_channel: ^3.0.3
  http: ^1.6.0
  image: ^4.9.2
  crypto: ^3.0.7
  path: ^1.9.1
  qr: ^4.0.0
  sesori_shared:
    path: ../../shared/sesori_shared
  clock: ^1.1.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  rxdart: ^0.28.0
  sesori_plugin_interface:
    path: ../sesori_plugin_interface
  sesori_bridge_foundation:
    path: ../sesori_bridge_foundation
  opencode_plugin:
    path: ../sesori_plugin_opencode
  codex_plugin:
    path: ../sesori_plugin_codex
  acp_plugin:
    path: ../sesori_plugin_acp
  cursor_plugin:
    path: ../sesori_plugin_cursor
  claude_plugin:
    path: ../sesori_plugin_claude
  hermes_plugin:
    path: ../sesori_plugin_hermes
  pi_plugin:
    path: ../sesori_plugin_pi
  omp_plugin:
    path: ../sesori_plugin_omp
  meta: ^1.19.0
  # Keep runtime and codegen on the same patch; skew breaks the Drift schema verifier.
  drift: 2.34.3
  collection: ^1.19.1
  win32: ^6.4.0

dev_dependencies:
  test: ^1.31.2
  lints: ^6.1.0
  fake_async: ^1.3.3
  # Tests exercise raw sqlite3 directly (drift migrations, DAO tests);
  # production code reaches sqlite3 only transitively through drift.
  sqlite3: ^3.5.2
  build_runner: any
  freezed: 4.0.0-dev.3
  json_serializable: ^6.14.1
  drift_dev: 2.34.3
