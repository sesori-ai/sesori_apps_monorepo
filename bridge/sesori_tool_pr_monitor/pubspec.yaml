name: sesori_tool_pr_monitor
description: The Sesori PR monitor tool group, which watches GitHub pull requests through the user's gh CLI.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.14.0

dependencies:
  clock: ^1.1.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  meta: ^1.19.0
  sesori_bridge_foundation:
    path: ../sesori_bridge_foundation
  sesori_shared:
    path: ../../shared/sesori_shared
  sesori_tool_interface:
    path: ../sesori_tool_interface

dev_dependencies:
  build_runner: any
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  test: ^1.33.0
