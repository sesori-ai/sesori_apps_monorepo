name: 'Prefetch native libraries'
description: >-
  Put the pinned, hash-verified libsqlite3, and the PDFium library pdfrx loads,
  where their build hooks (package:sqlite3, package:pdfium_dart) reuse them,
  from the Actions cache or a retried download (release API first, then the
  public URL), so tests and builds never depend on the hooks' own GitHub
  release downloads. sqlite3's hook only reuses a file whose SHA-256 matches
  its pin; PDFium archives are verified against pins in prefetch.py. Built and
  shipped bytes are unchanged. Named for its first library.
  Run it after `dart pub get` and before anything that runs build hooks.

inputs:
  workspace:
    description: 'Pub workspace directory whose hooks will run (client or bridge)'
    required: true
  platform:
    description: 'Build target: host (the runner OS), ios (device) or android'
    required: false
    default: 'host'

runs:
  using: 'composite'
  steps:
    - name: Resolve pinned native libraries
      id: plan
      shell: bash
      env:
        WORKSPACE: ${{ inputs.workspace }}
        PLATFORM: ${{ inputs.platform }}
      # python3 on Windows can resolve to the Microsoft Store stub.
      run: |
        if [ "$RUNNER_OS" = Windows ]; then py=python; else py=python3; fi
        "$py" "$GITHUB_ACTION_PATH/prefetch.py" plan --workspace "$WORKSPACE" --platform "$PLATFORM"

    # An empty key means no resolved package has a download hook to seed.
    - name: Restore native library cache
      id: cache
      if: steps.plan.outputs.key != ''
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.plan.outputs.path }}
        key: ${{ steps.plan.outputs.key }}

    - name: Seed native libraries
      if: steps.plan.outputs.key != ''
      shell: bash
      env:
        WORKSPACE: ${{ inputs.workspace }}
        PLATFORM: ${{ inputs.platform }}
        # Lets the gh download use the authenticated release API.
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ "$RUNNER_OS" = Windows ]; then py=python; else py=python3; fi
        "$py" "$GITHUB_ACTION_PATH/prefetch.py" seed --workspace "$WORKSPACE" --platform "$PLATFORM"

    # Saved right away rather than at job end, so a later test failure still
    # leaves the cache warm for the next run.
    - name: Save native library cache
      if: steps.plan.outputs.key != '' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ${{ steps.plan.outputs.path }}
        key: ${{ steps.plan.outputs.key }}
