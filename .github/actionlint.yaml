# GitHub-hosted preview label; actionlint's built-in runner list does not yet include it.
# This declares the exact additional label, not a self-hosted execution requirement.
# https://github.com/actions/runner-images/blob/main/images/macos/xcode-27-arm64-Readme.md
self-hosted-runner:
  labels:
    - xcode-27

# actionlint 1.7.12 lacks GitHub's concurrency.queue. Remove when the linter supports it.
# Only this key's syntax error is exempt; authenticated workflow contracts enforce max/no cancellation.
# https://github.com/rhysd/actionlint/issues/746
paths:
  .github/workflows/desktop-qualification.yml:
    ignore:
      - '^unexpected key "queue" for "concurrency" section\.'
