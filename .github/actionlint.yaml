# GitHub-hosted labels that actionlint 1.7.12's built-in runner list does not yet include.
# These declare the exact additional labels, not a self-hosted execution requirement.
# https://github.com/actions/runner-images#available-images
self-hosted-runner:
  labels:
    - xcode-27
    - ubuntu-26.04

# actionlint 1.7.12 lacks GitHub's concurrency.queue. Remove when the linter supports it.
# Only this key's syntax error is exempt; authenticated workflow contracts enforce max/no cancellation.
# https://github.com/rhysd/actionlint/issues/746
paths:
  .github/workflows/desktop-qualification.yml:
    ignore:
      - '^unexpected key "queue" for "concurrency" section\.'
