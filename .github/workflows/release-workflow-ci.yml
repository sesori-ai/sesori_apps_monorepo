name: Release Workflow CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/linux-repository.yml'
      - '.github/scripts/publish_linux_repository.py'
      - '.github/scripts/test_publish_linux_repository.py'
      - '.github/scripts/provision_linux_repository.sh'
      - '.github/workflows/desktop-linux-release.yml'
      - '.github/scripts/publish_desktop_linux.py'
      - '.github/scripts/test_publish_desktop_linux.py'
      - '.github/scripts/github_release_assets.py'
      - '.github/scripts/linux_signing.py'
      - '.github/scripts/sign_bridge_linux.py'
      - '.github/scripts/publish_bridge_linux_signatures.py'
      - '.github/scripts/test_bridge_linux_signatures.py'
      - '.github/workflows/sign-linux-release.yml'
      - '.github/workflows/bridge-npm-publish.yml'
      - '.github/scripts/test_bridge_build_workflow.py'
      - '.github/workflows/verify-macos-signing.yml'
      - '.github/workflows/submit-release.yml'
      - '.github/workflows/desktop-qualification.yml'
      - '.github/workflows/migrate-macos-signing-secrets.yml'
      - '.github/scripts/test_macos_signing_workflows.py'
      - '.github/actions/**'
      - '.github/workflows/_reusable-*.yml'
      - '.github/scripts/check_internal_release.sh'
      - '.github/scripts/test_check_internal_release.py'
      - '.github/workflows/release-all-platforms.yml'
      - '.github/workflows/release-workflow-ci.yml'
      - '.github/workflows/desktop-release.yml'
      - '.github/scripts/prepare_desktop_release.py'
      - '.github/scripts/test_prepare_desktop_release.py'
      - 'tool/release_scheduler/**'
      - 'docs/regression/bridge-installation-and-updates.md'
      - 'client/app/fastlane/**'
      - 'client/app/ios/fastlane/Fastfile'
      - 'client/app/android/fastlane/Fastfile'
      - '.github/scripts/publish_desktop_release.py'
      - '.github/scripts/test_publish_desktop_release.py'
  pull_request:
    paths:
      - '.github/workflows/linux-repository.yml'
      - '.github/scripts/publish_linux_repository.py'
      - '.github/scripts/test_publish_linux_repository.py'
      - '.github/scripts/provision_linux_repository.sh'
      - '.github/workflows/desktop-linux-release.yml'
      - '.github/scripts/publish_desktop_linux.py'
      - '.github/scripts/test_publish_desktop_linux.py'
      - '.github/scripts/github_release_assets.py'
      - '.github/scripts/linux_signing.py'
      - '.github/scripts/sign_bridge_linux.py'
      - '.github/scripts/publish_bridge_linux_signatures.py'
      - '.github/scripts/test_bridge_linux_signatures.py'
      - '.github/workflows/sign-linux-release.yml'
      - '.github/workflows/bridge-npm-publish.yml'
      - '.github/scripts/test_bridge_build_workflow.py'
      - '.github/workflows/verify-macos-signing.yml'
      - '.github/workflows/submit-release.yml'
      - '.github/workflows/desktop-qualification.yml'
      - '.github/workflows/migrate-macos-signing-secrets.yml'
      - '.github/scripts/test_macos_signing_workflows.py'
      - '.github/actions/**'
      - '.github/workflows/_reusable-*.yml'
      - '.github/scripts/check_internal_release.sh'
      - '.github/scripts/test_check_internal_release.py'
      - '.github/workflows/release-all-platforms.yml'
      - '.github/workflows/release-workflow-ci.yml'
      - '.github/workflows/desktop-release.yml'
      - '.github/scripts/prepare_desktop_release.py'
      - '.github/scripts/test_prepare_desktop_release.py'
      - 'tool/release_scheduler/**'
      - 'docs/regression/bridge-installation-and-updates.md'
      - 'client/app/fastlane/**'
      - 'client/app/ios/fastlane/Fastfile'
      - 'client/app/android/fastlane/Fastfile'
      - '.github/scripts/publish_desktop_release.py'
      - '.github/scripts/test_publish_desktop_release.py'

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Test bridge build workflow contracts
        run: python -m unittest discover -s .github/scripts -p 'test_bridge_build_workflow.py'
      - name: Test Linux CLI signing and existing-release publication contracts
        run: python -m unittest discover -s .github/scripts -p 'test_bridge_linux_signatures.py'
      - name: Test automatic macOS signing workflow contracts
        run: python -m unittest discover -s .github/scripts -p 'test_macos_signing_workflows.py'
      - name: Test desktop release preparation and publication boundaries
        env:
          SESORI_LINUX_SIGNING_TEST_REQUIRED: '1'
        run: |
          python -m unittest discover -s .github/scripts -p 'test_prepare_desktop_release.py'
          python -m unittest discover -s .github/scripts -p 'test_publish_desktop_release.py'
          python -m unittest discover -s .github/scripts -p 'test_publish_desktop_linux.py'
          python -m unittest discover -s .github/scripts -p 'test_publish_linux_repository.py'
      - name: Lint release gate and scoped repository provisioning
        run: shellcheck .github/scripts/check_internal_release.sh .github/scripts/provision_linux_repository.sh
      - name: Test automatic release decisions and attempt recording
        run: python3 .github/scripts/test_check_internal_release.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tool/release_scheduler/package-lock.json
      - name: Install release dispatcher tooling
        run: npm ci --prefix tool/release_scheduler
      - name: Typecheck release dispatcher
        run: npm run typecheck --prefix tool/release_scheduler
      - name: Test release dispatcher
        run: npm test --prefix tool/release_scheduler
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Check store lane syntax
        run: |
          ruby -c client/app/ios/fastlane/Fastfile
          ruby -c client/app/android/fastlane/Fastfile
      - name: Test batched store release notes and length limits
        run: ruby client/app/fastlane/test_build_changelog.rb
