name: Bridge CI

on:
  push:
    branches: [main]
    paths:
      - 'bridge/**'
      - 'shared/**'
      - '.tool-versions'
  pull_request:
    paths:
      - 'bridge/**'
      - 'shared/**'
      - '.tool-versions'

jobs:
  toolchain:
    runs-on: ubuntu-latest
    outputs:
      dart-version: ${{ steps.dart-version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve pinned Dart version
        id: dart-version
        shell: bash
        run: |
          set -euo pipefail
          TOOL_SPEC=$(awk '$1 == "flutter" {print $2}' .tool-versions)
          if [[ -z "$TOOL_SPEC" ]]; then
            echo "::error::No flutter entry found in .tool-versions"
            exit 1
          fi
          if [[ "$TOOL_SPEC" == *-* ]]; then
            FLUTTER_VERSION="${TOOL_SPEC%-*}"
            CHANNEL="${TOOL_SPEC##*-}"
          else
            FLUTTER_VERSION="$TOOL_SPEC"
            CHANNEL="stable"
          fi
          DART_VERSION=$(curl -fsSL https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json \
            | jq -r --arg v "$FLUTTER_VERSION" --arg c "$CHANNEL" \
                '[.releases[] | select(.version == $v and .channel == $c)][0].dart_sdk_version // empty
                 | if test("\\(build [^)]+\\)")
                   then capture("\\(build (?<version>[^)]+)\\)").version
                   else split(" ")[0]
                   end')
          if [[ -z "$DART_VERSION" ]]; then
            echo "::error::Could not resolve the Dart SDK bundled with Flutter ${TOOL_SPEC} from the Flutter releases manifest."
            exit 1
          fi
          echo "Flutter ${TOOL_SPEC} bundles Dart ${DART_VERSION}"
          echo "version=${DART_VERSION}" >> "$GITHUB_OUTPUT"

  test:
    needs: toolchain
    runs-on: ubuntu-latest
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@v6

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ needs.toolchain.outputs.dart-version }}

      - uses: actions/cache@v5
        with:
          path: ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-pub-${{ hashFiles('bridge/pubspec.lock') }}

      - name: Get dependencies (workspace)
        run: dart pub get
        working-directory: bridge

      - name: Analyze bridge/app
        run: dart analyze --fatal-infos
        working-directory: bridge/app

      - name: Analyze sesori_plugin_interface
        run: dart analyze --fatal-infos
        working-directory: bridge/sesori_plugin_interface

      - name: Analyze sesori_bridge_foundation
        run: dart analyze --fatal-infos
        working-directory: bridge/sesori_bridge_foundation

      - name: Analyze sesori_plugin_runtime
        run: dart analyze --fatal-infos
        working-directory: bridge/sesori_plugin_runtime

      - name: Analyze sesori_plugin_opencode
        run: dart analyze --fatal-infos
        working-directory: bridge/sesori_plugin_opencode

      - name: Analyze sesori_plugin_codex
        run: dart analyze --fatal-infos
        working-directory: bridge/sesori_plugin_codex

      - name: Analyze sesori_plugin_acp
        run: dart analyze --fatal-infos
        working-directory: bridge/sesori_plugin_acp

      - name: Analyze sesori_plugin_cursor
        run: dart analyze --fatal-infos
        working-directory: bridge/sesori_plugin_cursor

      - name: Analyze sesori_plugin_omp
        run: dart analyze --fatal-infos
        working-directory: bridge/sesori_plugin_omp

      - name: Analyze sesori_plugin_claude
        run: dart analyze --fatal-infos
        working-directory: bridge/sesori_plugin_claude

      - name: Analyze sesori_plugin_pi
        run: dart analyze --fatal-infos
        working-directory: bridge/sesori_plugin_pi

      - name: Run tests for bridge/app
        run: dart test
        working-directory: bridge/app

      - name: Run tests for sesori_plugin_interface
        run: dart test
        working-directory: bridge/sesori_plugin_interface

      - name: Run tests for sesori_bridge_foundation
        run: dart test
        working-directory: bridge/sesori_bridge_foundation

      - name: Run tests for sesori_plugin_runtime
        run: dart test
        working-directory: bridge/sesori_plugin_runtime

      - name: Run tests for sesori_plugin_opencode
        run: dart test
        working-directory: bridge/sesori_plugin_opencode

      - name: Run tests for sesori_plugin_codex
        run: dart test
        working-directory: bridge/sesori_plugin_codex

      - name: Run tests for sesori_plugin_acp
        run: dart test
        working-directory: bridge/sesori_plugin_acp

      - name: Run tests for sesori_plugin_cursor
        run: dart test
        working-directory: bridge/sesori_plugin_cursor

      - name: Run tests for sesori_plugin_omp
        run: dart test
        working-directory: bridge/sesori_plugin_omp

      - name: Run tests for sesori_plugin_claude
        run: dart test
        working-directory: bridge/sesori_plugin_claude

      - name: Run tests for sesori_plugin_pi
        run: dart test
        working-directory: bridge/sesori_plugin_pi

  build-smoke:
    needs: toolchain
    runs-on: ubuntu-latest
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@v6

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ needs.toolchain.outputs.dart-version }}

      - uses: actions/cache@v5
        with:
          path: ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-pub-${{ hashFiles('bridge/pubspec.lock') }}

      - name: Get dependencies (workspace)
        run: dart pub get
        working-directory: bridge

      - name: Compile smoke test
        shell: bash
        working-directory: bridge/app
        run: dart build cli -o build
