name: Bridge CI

on:
  push:
    branches: [main]
    paths:
      - 'bridge/**'
      - 'shared/**'
      - 'install.sh'
      - 'install.ps1'
      - '.tool-versions'
  pull_request:
    paths:
      - 'bridge/**'
      - 'shared/**'
      - 'install.sh'
      - 'install.ps1'
      - '.tool-versions'

concurrency:
  group: bridge-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  toolchain:
    runs-on: ubuntu-latest
    outputs:
      dart-version: ${{ steps.dart-version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve pinned Dart version
        id: dart-version
        uses: ./.github/actions/resolve-flutter-dart-version

  # Parallel slices so the slowest one, not the sum, sets the wall time.
  # `app` tests alone take as long as every other bridge package combined.
  test:
    needs: toolchain
    strategy:
      fail-fast: false
      matrix:
        task: [analyze, test-app, test-packages, shared]
    runs-on: ubuntu-latest
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@v6

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ needs.toolchain.outputs.dart-version }}

      - uses: actions/cache@v5
        with:
          path: ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-pub-${{ hashFiles('bridge/pubspec.lock') }}

      - name: Get dependencies (workspace)
        run: dart pub get
        working-directory: bridge

      - name: Get analyzer plugin dependencies
        run: dart pub get
        working-directory: shared/no_slop_linter

      - name: Analyze bridge packages
        if: matrix.task == 'analyze'
        shell: bash
        working-directory: bridge
        run: |
          for module in $(sed -n 's/^MODULES := //p' Makefile); do
            echo "::group::analyze $module"
            (cd "$module" && dart analyze --fatal-infos)
            echo "::endgroup::"
          done

      - name: Run bridge tests
        if: startsWith(matrix.task, 'test-')
        shell: bash
        working-directory: bridge
        env:
          TASK: ${{ matrix.task }}
        run: |
          for module in $(sed -n 's/^MODULES := //p' Makefile); do
            if [ "$TASK" = test-app ] && [ "$module" != app ]; then continue; fi
            if [ "$TASK" = test-packages ] && [ "$module" = app ]; then continue; fi
            if [ -d "$module/test" ]; then
              echo "::group::test $module"
              (cd "$module" && dart test)
              echo "::endgroup::"
            fi
          done

      - name: Analyze and test shared packages
        if: matrix.task == 'shared'
        shell: bash
        working-directory: shared
        run: |
          modules="$(sed -n 's/^MODULES := //p' Makefile)"
          # Resolve every package first: sesori_shared loads no_slop_linter as an
          # analyzer plugin by path, so the plugin must have its own dependencies
          # before the first analysis runs.
          for module in $modules; do
            echo "::group::pub get $module"
            (cd "$module" && dart pub get)
            echo "::endgroup::"
          done
          for module in $modules; do
            echo "::group::$module"
            (cd "$module" && dart analyze --fatal-infos)
            if [ -d "$module/test" ]; then
              (cd "$module" && dart test)
            fi
            echo "::endgroup::"
          done

  codegen-freshness:
    needs: toolchain
    runs-on: ubuntu-latest
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@v6

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ needs.toolchain.outputs.dart-version }}

      - uses: actions/cache@v5
        with:
          path: ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-pub-${{ hashFiles('bridge/pubspec.lock') }}

      - name: Get dependencies (workspace)
        run: dart pub get
        working-directory: bridge

      - name: Verify offline OpenCode SSE generation is fresh
        working-directory: bridge/sesori_plugin_opencode
        run: |
          dart run tool/generate_sse_events.dart
          git diff --exit-code -- lib/src/models/sse_event_data.g.dart

  build-smoke:
    needs: toolchain
    runs-on: ubuntu-latest
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@v6

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ needs.toolchain.outputs.dart-version }}

      - uses: actions/cache@v5
        with:
          path: ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-pub-${{ hashFiles('bridge/pubspec.lock') }}

      - name: Get dependencies (workspace)
        run: dart pub get
        working-directory: bridge

      - name: Compile smoke test
        shell: bash
        working-directory: bridge/app
        run: dart build cli -o build
