name: Design Catalog CI

on:
  push:
    branches: [main]
    paths: &paths
      - 'client/design_catalog/**'
      - 'client/module_prego/**'
      - 'client/pubspec.yaml'
      - 'client/pubspec.lock'
      - 'client/analysis_options.yaml'
      - 'client/Makefile'
      - 'shared/no_slop_linter/**'
      - 'shared/sesori_shared/**'
      - '.tool-versions'
      - '.github/actions/resolve-flutter-dart-version/**'
      - '.github/workflows/design-catalog-ci.yml'
      - 'tool/dart_format.sh'
  pull_request:
    paths: *paths

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read Flutter version from .tool-versions
        id: flutter
        uses: ./.github/actions/resolve-flutter-dart-version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.flutter-version }}
          channel: ${{ steps.flutter.outputs.flutter-channel }}

      - name: Validate catalog
        working-directory: client
        run: |
          DART_BIN=$(command -v dart)
          FLUTTER_BIN=$(command -v flutter)
          FLUTTER_SDK_ROOT=$(dirname "$(dirname "$FLUTTER_BIN")")
          make DART="$DART_BIN" FLUTTER="$FLUTTER_BIN" FLUTTER_ROOT="$FLUTTER_SDK_ROOT" catalog-check

      - name: Check catalog formatting
        run: tool/dart_format.sh --check client/design_catalog
