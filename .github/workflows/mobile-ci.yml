name: Mobile CI

on:
  push:
    branches: [main]
    # Scoped to the mobile PRODUCT paths (not blanket client/**) so future
    # client/desktop PRs never trigger mobile CI — release-safety invariant #3.
    paths:
      - 'client/app/**'
      - 'client/module_core/**'
      - 'client/module_auth/**'
      - 'client/module_prego/**'
      - 'client/pubspec.yaml'
      - 'client/pubspec.lock'
      - 'client/analysis_options.yaml'
      - 'client/Makefile'
      - 'shared/**'
      - '.tool-versions'
  pull_request:
    paths:
      - 'client/app/**'
      - 'client/module_core/**'
      - 'client/module_auth/**'
      - 'client/module_prego/**'
      - 'client/pubspec.yaml'
      - 'client/pubspec.lock'
      - 'client/analysis_options.yaml'
      - 'client/Makefile'
      - 'shared/**'
      - '.tool-versions'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Read Flutter version from .tool-versions
        shell: bash
        run: |
          TOOL_SPEC=$(awk '$1 == "flutter" { print $2 }' .tool-versions)
          if [ -z "$TOOL_SPEC" ]; then
            echo "Unable to find a Flutter version in .tool-versions" >&2
            exit 1
          fi
          if [[ "$TOOL_SPEC" == *-* ]]; then
            FLUTTER_VERSION="${TOOL_SPEC%-*}"
            FLUTTER_CHANNEL="${TOOL_SPEC##*-}"
          else
            FLUTTER_VERSION="$TOOL_SPEC"
            FLUTTER_CHANNEL="stable"
          fi
          echo "FLUTTER_VERSION=$FLUTTER_VERSION" >> "$GITHUB_ENV"
          echo "FLUTTER_CHANNEL=$FLUTTER_CHANNEL" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}

      - name: Get dependencies (workspace)
        run: dart pub get
        working-directory: client

      - name: Analyze client/app
        run: dart analyze --fatal-infos
        working-directory: client/app

      - name: Analyze module_core
        run: dart analyze --fatal-infos
        working-directory: client/module_core

      - name: Analyze module_auth
        run: dart analyze --fatal-infos
        working-directory: client/module_auth

      - name: Analyze module_prego
        run: dart analyze --fatal-infos
        working-directory: client/module_prego

      - name: Run tests for module_core
        run: dart test
        working-directory: client/module_core

      - name: Run tests for module_auth
        run: dart test
        working-directory: client/module_auth

      - name: Run tests for module_prego
        run: flutter test
        working-directory: client/module_prego

      - name: Run tests for client/app
        run: flutter test
        working-directory: client/app

      - name: Get dependencies (no_slop_linter)
        run: dart pub get
        working-directory: shared/no_slop_linter

      - name: Run tests for no_slop_linter
        run: dart test
        working-directory: shared/no_slop_linter
