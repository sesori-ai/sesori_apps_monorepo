name: Mobile CI

on:
  push:
    branches: [main]
    # Scoped to the mobile PRODUCT paths (not blanket client/**) so future
    # client/desktop PRs never trigger mobile CI — release-safety invariant #3.
    paths:
      - 'client/app/**'
      - 'client/module_core/**'
      - 'client/module_auth/**'
      - 'client/module_prego/**'
      - 'client/module_app_ui/**'
      - 'client/pubspec.yaml'
      - 'client/pubspec.lock'
      - 'client/analysis_options.yaml'
      - 'client/Makefile'
      - 'shared/**'
      - '.github/scripts/publish_firebase_analytics_release_cutoff.py'
      - '.github/scripts/test_publish_firebase_analytics_release_cutoff.py'
      - '.github/workflows/publish-firebase-analytics-release-cutoff.yml'
      - '.github/workflows/submit-release.yml'
      - '.tool-versions'
      - '.github/workflows/mobile-ci.yml'
      - '.github/scripts/run_test_shard.sh'
  pull_request:
    paths:
      - 'client/app/**'
      - 'client/module_core/**'
      - 'client/module_auth/**'
      - 'client/module_prego/**'
      - 'client/module_app_ui/**'
      - 'client/pubspec.yaml'
      - 'client/pubspec.lock'
      - 'client/analysis_options.yaml'
      - 'client/Makefile'
      - 'shared/**'
      - '.github/scripts/publish_firebase_analytics_release_cutoff.py'
      - '.github/scripts/test_publish_firebase_analytics_release_cutoff.py'
      - '.github/workflows/publish-firebase-analytics-release-cutoff.yml'
      - '.github/workflows/submit-release.yml'
      - '.tool-versions'
      - '.github/workflows/mobile-ci.yml'
      - '.github/scripts/run_test_shard.sh'

concurrency:
  group: mobile-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  toolchain:
    runs-on: ubuntu-latest
    outputs:
      flutter-version: ${{ steps.flutter-version.outputs.version }}
      flutter-channel: ${{ steps.flutter-version.outputs.channel }}
    steps:
      - uses: actions/checkout@v6

      - name: Test Firebase analytics release cutoff publisher
        run: python3 .github/scripts/test_publish_firebase_analytics_release_cutoff.py

      - name: Read Flutter version from .tool-versions
        id: flutter-version
        shell: bash
        run: |
          TOOL_SPEC=$(awk '$1 == "flutter" { print $2 }' .tool-versions)
          if [ -z "$TOOL_SPEC" ]; then
            echo "Unable to find a Flutter version in .tool-versions" >&2
            exit 1
          fi
          if [[ "$TOOL_SPEC" == *-* ]]; then
            FLUTTER_VERSION="${TOOL_SPEC%-*}"
            FLUTTER_CHANNEL="${TOOL_SPEC##*-}"
          else
            FLUTTER_VERSION="$TOOL_SPEC"
            FLUTTER_CHANNEL="stable"
          fi
          echo "version=$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$FLUTTER_CHANNEL" >> "$GITHUB_OUTPUT"

  analyze:
    needs: toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.toolchain.outputs.flutter-version }}
          channel: ${{ needs.toolchain.outputs.flutter-channel }}
          cache: true

      - name: Get dependencies (workspace)
        run: dart pub get
        working-directory: client

      # One workspace-wide pass shares resolved libraries across packages and
      # is several times faster than analyzing each package separately. It
      # also covers the desktop packages, which is harmless extra coverage.
      - name: Analyze client workspace
        run: dart analyze --fatal-infos
        working-directory: client

  # One job per package, and two for the largest, so the slowest shard, not
  # the sum, sets the wall time.
  # no_slop_linter tests run in Bridge CI, which triggers on every shared/** change.
  test:
    needs: toolchain
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: app
            runner: flutter
            shard: 1/2
          - package: app
            runner: flutter
            shard: 2/2
          - package: module_core
            runner: dart
            shard: 1/1
          - package: module_auth
            runner: dart
            shard: 1/1
          - package: module_prego
            runner: flutter
            shard: 1/1
          - package: module_app_ui
            runner: flutter
            shard: 1/1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.toolchain.outputs.flutter-version }}
          channel: ${{ needs.toolchain.outputs.flutter-channel }}
          cache: true

      - name: Get dependencies (workspace)
        run: dart pub get
        working-directory: client

      - name: Run tests for ${{ matrix.package }} (shard ${{ matrix.shard }})
        # The default of half the cores leaves a 4-core runner mostly idle
        # while tests wait on timers and subprocesses.
        run: ../../.github/scripts/run_test_shard.sh ${{ matrix.runner }} ${{ matrix.shard }} -j 4
        working-directory: client/${{ matrix.package }}
