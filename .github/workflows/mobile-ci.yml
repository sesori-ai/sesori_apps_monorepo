name: Mobile CI

on:
  push:
    branches: [main]
    # Scoped to the mobile PRODUCT paths (not blanket client/**) so future
    # client/desktop PRs never trigger mobile CI — release-safety invariant #3.
    paths: &paths
      - 'client/app/**'
      - 'client/module_core/**'
      - 'client/module_auth/**'
      - 'client/module_persistence/**'
      - 'client/module_prego/**'
      - 'client/module_app_ui/**'
      - 'client/pubspec.yaml'
      - 'client/pubspec.lock'
      - 'client/analysis_options.yaml'
      - 'client/Makefile'
      - 'shared/**'
      - '.tool-versions'
      - '.github/actions/resolve-flutter-dart-version/**'
      - '.github/workflows/mobile-ci.yml'
      - '.github/scripts/run_test_shard.sh'
      - 'tool/dart_format.sh'
  pull_request:
    paths: *paths

concurrency:
  group: mobile-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  toolchain:
    runs-on: ubuntu-latest
    outputs:
      flutter-version: ${{ steps.flutter.outputs.flutter-version }}
      flutter-channel: ${{ steps.flutter.outputs.flutter-channel }}
    steps:
      - uses: actions/checkout@v6

      - name: Read Flutter version from .tool-versions
        id: flutter
        uses: ./.github/actions/resolve-flutter-dart-version

  analyze:
    needs: toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.toolchain.outputs.flutter-version }}
          channel: ${{ needs.toolchain.outputs.flutter-channel }}
          cache: true

      - name: Get dependencies (workspace)
        run: dart pub get
        working-directory: client

      # One workspace-wide pass shares resolved libraries across packages and
      # is several times faster than analyzing each package separately. It
      # also covers the desktop packages, which is harmless extra coverage.
      - name: Analyze client workspace
        run: dart analyze --fatal-infos
        working-directory: client

      # Like the analysis, this covers the whole workspace. Desktop CI and
      # Design Catalog CI check their own packages for changes that skip this
      # workflow.
      - name: Check client formatting
        run: tool/dart_format.sh --check client

  # One job per package, and two for the largest, so the slowest shard, not
  # the sum, sets the wall time.
  # no_slop_linter tests run in Bridge CI, which triggers on every shared/** change.
  test:
    needs: toolchain
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: app
            runner: flutter
            shard: 1/2
          - package: app
            runner: flutter
            shard: 2/2
          - package: module_core
            runner: dart
            shard: 1/1
          - package: module_auth
            runner: dart
            shard: 1/1
          - package: module_persistence
            runner: dart
            shard: 1/1
          - package: module_prego
            runner: flutter
            shard: 1/1
          - package: module_app_ui
            runner: flutter
            shard: 1/1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.toolchain.outputs.flutter-version }}
          channel: ${{ needs.toolchain.outputs.flutter-channel }}
          cache: true

      - name: Get dependencies (workspace)
        run: dart pub get
        working-directory: client

      - name: Run tests for ${{ matrix.package }} (shard ${{ matrix.shard }})
        # The default of half the cores leaves a 4-core runner mostly idle
        # while tests wait on timers and subprocesses.
        run: ../../.github/scripts/run_test_shard.sh ${{ matrix.runner }} ${{ matrix.shard }} -j 4
        working-directory: client/${{ matrix.package }}
