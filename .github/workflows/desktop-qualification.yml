name: Desktop Native Qualification

# Default qualification: no signing credentials, release tags, publication or GUI launch.
# Explicit manual macOS/Linux packaging modes produce private signed test artifacts.
# Targeted SDK/tooling qualification, NOT another full-source PR CI matrix.
# Product source changes remain covered by desktop-ci.yml and explicit packaged release gates.
# Shared releases reuse native macOS/Linux legs; bridge/mobile finalization remains independent.
on:
  workflow_call:
    inputs:
      source_sha:
        description: 'Exact committed product source from the shared release resolver'
        required: true
        type: string
      build_number:
        description: 'Aligned product build number'
        required: true
        type: string
      channel:
        required: true
        type: string
      mode:
        type: string
        default: macos-packaging
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'macOS/Linux packaging: optional exact main-ancestor source (blank = current main)'
        type: string
      build_number:
        description: 'macOS/Linux/Windows packaging: shared product build number (blank = qualification run number)'
        type: string
      mode:
        description: 'Qualification mode (no product publication)'
        type: choice
        options:
          - native-builds
          - macos-signing-preflight
          - macos-packaging
          - macos-gui-probe
          - macos-upgrade-probe
          - macos-authenticated-upgrade-probe
          - windows-packaging
          - linux-packaging
          - linux-session
          - linux-authenticated-upgrade-probe
          - linux-interactive-debug
        default: native-builds
      debug_arch:
        description: 'Manual Linux diagnostic runner CPU (KDE/X11; no qualification or account credentials)'
        type: choice
        options: [arm64, x64]
        default: arm64
      channel:
        description: 'Compiled download channel (macOS/Linux/Windows packaging and macOS upgrade modes)'
        type: choice
        options: [stable, internal]
        default: stable
      packaging_run:
        description: 'Current signed producer (macOS GUI/upgrades; Linux sessions/authenticated replacement/debug)'
        type: string
      previous_packaging_run:
        description: 'Older signed producer (macOS upgrades; Linux sessions/authenticated replacement)'
        type: string
  pull_request:
    paths:
      - '.github/workflows/desktop-qualification.yml'
      - '.github/workflows/desktop-linux-session.yml'
      - '.github/workflows/desktop-linux-authenticated-upgrade.yml'
      - '.github/scripts/desktop_qa_credentials.py'
      - '.github/scripts/qualify_desktop_linux_authenticated_upgrade.py'
      - '.github/scripts/test_qualify_desktop_linux_authenticated_upgrade.py'
      - '.github/actions/setup-xcode/**'
      - '.github/scripts/qualify_desktop.py'
      - '.github/scripts/test_qualify_desktop.py'
      - '.github/scripts/qualify_desktop_linux_session.py'
      - '.github/scripts/test_qualify_desktop_linux_session.py'
      - '.github/scripts/github_release_assets.py'
      - '.github/scripts/debug_desktop_linux_session.py'
      - '.github/scripts/test_debug_desktop_linux_session.py'
      - '.github/scripts/package_desktop_macos.py'
      - '.github/scripts/test_package_desktop_macos.py'
      - 'client/desktop/macos/Bridge.entitlements'
      - '.github/scripts/package_desktop_windows.py'
      - '.github/scripts/test_package_desktop_windows.py'
      - '.github/scripts/package_desktop_linux.py'
      - '.github/scripts/qualify_desktop_linux_package.sh'
      - '.github/scripts/test_package_desktop_linux.py'
      - '.github/scripts/sign_desktop_linux.py'
      - '.github/scripts/test_sign_desktop_linux.py'
      - '.github/scripts/sign_desktop_update.py'
      - '.github/scripts/test_sign_desktop_update.py'
      - '.github/scripts/build_linux_repository.py'
      - '.github/scripts/test_build_linux_repository.py'
      - '.github/scripts/publish_linux_repository.py'
      - '.github/scripts/publish_desktop_linux.py'
      - '.github/scripts/prepare_desktop_release.py'
      - '.github/scripts/Dockerfile.linux-repository'
      - '.github/scripts/Dockerfile.linux-signing'
      - '.github/scripts/linux_signing.py'
      - '.github/scripts/sign_bridge_linux.py'
      - 'client/app/android/app/src/main/ic_launcher-playstore.png'
      - 'client/desktop/windows/runner/main.cpp'
      - 'client/desktop/windows/runner/resources/app_icon.ico'
      - 'client/desktop/lib/core/platform/io_launch_at_login.dart'
      - '.github/scripts/macos_signing_ci.sh'
      - '.github/scripts/test_macos_signing_workflows.py'
      - '.github/scripts/probe_sparkle.swift'
      - '.github/scripts/probe_desktop_macos.py'
      - '.github/scripts/test_probe_desktop_macos.py'
      - '.github/scripts/qualify_desktop_macos_upgrade.py'
      - '.github/scripts/test_qualify_desktop_macos_upgrade.py'
      - '.github/scripts/qualify_desktop_macos_authenticated_upgrade.py'
      - '.github/scripts/test_qualify_desktop_macos_authenticated_upgrade.py'
      - '.github/scripts/write_desktop_macos_keychain.swift'
      - '.github/scripts/inspect_desktop_macos_window.swift'
      - '.github/scripts/quit_desktop_macos.swift'
      - 'client/desktop/test/native/packaged_platform_probe.dart'
      - 'client/desktop/test/native/packaged_authenticated_probe.dart'
      - '.tool-versions'
      - 'client/desktop/tool/stage_desktop_bundle.dart'
      - 'client/module_desktop_core/lib/src/foundation/models/desktop_bundle_identity.dart'

permissions:
  contents: read

concurrency:
  # Authenticated jobs share the account queue below. Their outer workflows must not coalesce waiters.
  # Parallel Linux/macOS packaging calls still must not cancel each other.
  group: >-
    desktop-qualification-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{
      contains(fromJSON('["macos-authenticated-upgrade-probe","linux-authenticated-upgrade-probe"]'), inputs.mode) &&
      github.run_id || inputs.mode == 'linux-interactive-debug' && 'linux-debug' ||
      inputs.mode == 'linux-session' && 'linux-session' || inputs.mode == 'linux-packaging' && 'linux' || 'other' }}
  cancel-in-progress: true

jobs:
  linux-session:
    needs: tooling
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'linux-session'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/desktop-linux-session.yml
    with:
      previous_run: ${{ inputs.previous_packaging_run }}
      current_run: ${{ inputs.packaging_run }}

  linux-interactive-debug:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'linux-interactive-debug'
    # This environment owns ref trust: main plus the explicitly approved dedicated QA branch.
    environment: desktop-linux-debug
    runs-on: ${{ inputs.debug_arch == 'x64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      DEBUG_HOST: sesori-linux-debug-${{ github.run_id }}-${{ github.run_attempt }}
      DEBUG_ARCH: ${{ inputs.debug_arch }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Require an explicit retained signed producer and configured federation
        env:
          PACKAGING_RUN: ${{ inputs.packaging_run }}
          TAILSCALE_CLIENT_ID: ${{ vars.TAILSCALE_CLIENT_ID }}
          TAILSCALE_AUDIENCE: ${{ vars.TAILSCALE_AUDIENCE }}
        run: |
          [[ "$PACKAGING_RUN" =~ ^[1-9][0-9]*$ && -n "$TAILSCALE_CLIENT_ID" && -n "$TAILSCALE_AUDIENCE" ]] || {
            echo 'Select a retained signed internal packaging run and configure desktop-linux-debug OIDC variables.'
            exit 1
          }
      - name: Install diagnostic tools before joining the private network
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            dbus-x11 python3-dbus python3-pyatspi gnome-keyring libsecret-tools gsettings-desktop-schemas \
            plasma-desktop plasma-workspace kwin-x11 xvfb xauth wmctrl xdotool imagemagick mesa-utils \
            x11vnc rpm gnupg
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.packaging_run }}
          pattern: desktop-linux-*
          path: build/linux-debug-producer
      - name: Independently verify original signed internal artifacts without publishing
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGING_RUN: ${{ inputs.packaging_run }}
        run: |
          /usr/bin/python3 .github/scripts/debug_desktop_linux_session.py prepare \
            --run-id "$PACKAGING_RUN" --tooling-sha "$GITHUB_SHA" \
            --inputs build/linux-debug-producer --output build/linux-debug-inputs
      - name: Join the ephemeral runner through restricted GitHub OIDC
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ vars.TAILSCALE_CLIENT_ID }}
          audience: ${{ vars.TAILSCALE_AUDIENCE }}
          tags: tag:sesori-ci-debug
          hostname: ${{ env.DEBUG_HOST }}
          args: --ssh --accept-dns=false
      - name: Disable the action's default subnet routes before starting the desktop
        # The pinned action supplies --accept-routes itself; duplicating it in args is rejected.
        run: sudo tailscale set --accept-routes=false
      - name: Serve a disposable anonymous KDE desktop for at most 20 ready minutes
        timeout-minutes: 25
        run: |
          dbus-run-session -- /usr/bin/python3 .github/scripts/debug_desktop_linux_session.py serve \
            --inputs build/linux-debug-inputs --output build/linux-debug-session \
            --architecture "$DEBUG_ARCH"
      # No automatic uploads: interactive diagnostics may contain operator-entered data.
      # The Tailscale action's post step logs out; the job and isolated home are disposable.

  macos-gui:
    needs: tooling
    if: >-
      github.event_name != 'workflow_dispatch' || inputs.mode == 'native-builds' || inputs.mode == 'macos-packaging'
    runs-on: xcode-27
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      PUB_CACHE: ${{ github.workspace }}/../desktop-qualification-pub-cache
      SOURCE_SHA: ${{ inputs.mode == 'macos-packaging' && inputs.source_sha || github.sha }}
      BUILD_NUMBER: ${{ inputs.mode == 'macos-packaging' && inputs.build_number || github.run_number }}
      CHANNEL: ${{ inputs.mode == 'macos-packaging' && inputs.channel || 'stable' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require trusted committed product source for packaging
        if: inputs.mode == 'macos-packaging'
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main && "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .ci-workflow
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: arm64
      - name: Set up ARM Xcode
        uses: ./.ci-workflow/.github/actions/setup-xcode
      - name: Bootstrap pinned ARM SDK
        env:
          SDK_DIR: ${{ runner.temp }}/desktop-qualification-flutter
        run: |
          set -euo pipefail
          mkdir -p build/desktop-qualification
          python .github/scripts/qualify_desktop.py bootstrap --arch arm64 --sdk-dir "$SDK_DIR" \
            2>&1 | tee build/desktop-qualification/bootstrap.log
      - name: Resolve locked client workspace
        run: |
          set -euo pipefail
          printf '%s\n' '/.ci-workflow/' >> "$(git rev-parse --git-path info/exclude)"
          (cd client && flutter pub get --enforce-lockfile) 2>&1 | tee build/desktop-qualification/client-pub.log
      - name: Compile target GUI on ARM
        run: |
          set -euo pipefail
          dart --packages="$GITHUB_WORKSPACE/client/.dart_tool/package_config.json" \
            .ci-workflow/client/desktop/tool/stage_desktop_bundle.dart \
            --source-root "$GITHUB_WORKSPACE" --mode gui --architecture '${{ matrix.arch }}' \
            --build-number "$BUILD_NUMBER" --channel "$CHANNEL" --output build/desktop-macos-gui/product \
            2>&1 | tee build/desktop-qualification/gui-build.log
          test ! -s build/desktop-macos-gui/product/build-source-changes.patch
      - name: Compile separate target platform probe on ARM
        run: |
          set -euo pipefail
          dart --packages="$GITHUB_WORKSPACE/client/.dart_tool/package_config.json" \
            .ci-workflow/client/desktop/tool/stage_desktop_bundle.dart \
            --source-root "$GITHUB_WORKSPACE" --mode probe --architecture '${{ matrix.arch }}' \
            --build-number "$BUILD_NUMBER" --channel "$CHANNEL" --output build/desktop-macos-gui/probe \
            2>&1 | tee build/desktop-qualification/platform-probe-build.log
          test ! -s build/desktop-macos-gui/probe/build-source-changes.patch
      - name: Inspect target headers and archive both GUI payloads
        run: |
          set -euo pipefail
          for component in product probe; do
            python .ci-workflow/.github/scripts/qualify_desktop.py inspect-gui --arch '${{ matrix.arch }}' \
              --source-root "$GITHUB_WORKSPACE" \
              --bundle-dir "$GITHUB_WORKSPACE/build/desktop-macos-gui/$component/Sesori.app"
          done
          cp build/desktop-qualification/sdk.json build/desktop-macos-gui/gui-sdk.json
          tar -czf 'build/macos-gui-${{ matrix.arch }}.tar.gz' -C build desktop-macos-gui
      - name: Upload same-run GUI handoff without signing credentials
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-gui-${{ matrix.arch }}
          path: build/macos-gui-${{ matrix.arch }}.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Retain ARM compiler evidence, including partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-gui-evidence-${{ matrix.arch }}
          path: |
            build/desktop-qualification/*.json
            build/desktop-qualification/*.log
            build/desktop-macos-gui/**/gui-inventory.json
            build/desktop-macos-gui/**/dart-defines.env
            build/desktop-macos-gui/**/build-source-changes.patch
          if-no-files-found: warn
          retention-days: 14

  macos-distribution:
    # Automatic signing is separate from any future human-gated publication job.
    environment: macos-signing
    needs: [tooling, macos-gui]
    if: >-
      !cancelled() && needs.tooling.result == 'success' && github.event_name == 'workflow_dispatch' &&
      (inputs.mode == 'macos-signing-preflight' || inputs.mode == 'macos-packaging' ||
       inputs.mode == 'macos-gui-probe') &&
      (inputs.mode != 'macos-packaging' || needs.macos-gui.result == 'success')
    permissions:
      contents: read
      actions: read
    timeout-minutes: ${{ inputs.mode == 'macos-packaging' && 75 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26-intel
            arch: x64
          - runner: xcode-27
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      PUB_CACHE: ${{ github.workspace }}/../desktop-qualification-pub-cache
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require trusted committed product source
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main && "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .ci-workflow
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
      - name: Set up native Xcode
        uses: ./.ci-workflow/.github/actions/setup-xcode

      - name: Bootstrap pinned native SDK
        if: inputs.mode == 'macos-packaging'
        env:
          SDK_DIR: ${{ runner.temp }}/desktop-qualification-flutter
        run: |
          set -euo pipefail
          mkdir -p build/desktop-qualification
          python .github/scripts/qualify_desktop.py bootstrap --arch '${{ matrix.arch }}' --sdk-dir "$SDK_DIR" \
            2>&1 | tee build/desktop-qualification/bootstrap.log

      # GITHUB_PATH takes effect after bootstrap; this host builds only the helper.
      - name: Resolve locked workspaces
        if: inputs.mode == 'macos-packaging'
        run: |
          set -euo pipefail
          (cd bridge && dart pub get --enforce-lockfile) 2>&1 | tee build/desktop-qualification/bridge-pub.log
          (cd client && flutter pub get --enforce-lockfile) 2>&1 | tee build/desktop-qualification/client-pub.log

      - uses: actions/download-artifact@v4
        if: inputs.mode == 'macos-packaging'
        with:
          name: desktop-macos-gui-${{ matrix.arch }}
          path: build/macos-gui-input

      - name: Build native helper and assemble the matching GUI
        if: inputs.mode == 'macos-packaging'
        env:
          BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          printf '%s\n' '/.ci-workflow/' >> "$(git rev-parse --git-path info/exclude)"
          tar -xzf 'build/macos-gui-input/macos-gui-${{ matrix.arch }}.tar.gz' -C build
          cp build/desktop-macos-gui/product/gui-inventory.json build/desktop-qualification/product-gui-inventory.json
          cp build/desktop-macos-gui/probe/gui-inventory.json build/desktop-qualification/probe-gui-inventory.json
          cp build/desktop-macos-gui/gui-sdk.json build/desktop-qualification/gui-sdk.json
          dart --packages="$GITHUB_WORKSPACE/client/.dart_tool/package_config.json" \
            .ci-workflow/client/desktop/tool/stage_desktop_bundle.dart \
            --source-root "$GITHUB_WORKSPACE" --mode assemble --gui-input build/desktop-macos-gui/product \
            --build-number "$BUILD_NUMBER" --channel "$CHANNEL" --output build/desktop-bundle \
            2>&1 | tee build/desktop-qualification/bundle-build.log
          if [[ -s build/desktop-bundle/build-source-changes.patch ]]; then
            echo 'Commit build-generated source changes before signing; see build-source-changes.patch.' >&2
            exit 1
          fi
          ditto build/desktop-macos-gui/probe/Sesori.app build/desktop-platform-probe/Sesori.app

      - name: Validate GUI-only artifact selection
        if: inputs.mode == 'macos-gui-probe'
        env:
          PACKAGING_RUN: ${{ inputs.packaging_run }}
        run: |
          [[ "$PACKAGING_RUN" =~ ^[1-9][0-9]*$ ]] || { echo 'Select a trusted successful packaging run'; exit 1; }

      - uses: actions/download-artifact@v4
        if: inputs.mode == 'macos-gui-probe'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.packaging_run }}
          name: desktop-macos-packages-${{ matrix.arch }}
          path: build/desktop-gui-download

      - name: Re-probe the existing signed GUI without rebuilding or signing
        if: inputs.mode == 'macos-gui-probe'
        run: |
          set -euo pipefail
          mkdir -p build/desktop-macos-packaging
          ditto -xk 'build/desktop-gui-download/Sesori-macos-${{ matrix.arch }}.zip' build/desktop-gui-download/expanded
          python .github/scripts/probe_desktop_macos.py \
            --app build/desktop-gui-download/expanded/Sesori.app \
            --output build/desktop-macos-packaging/platform-probe \
            2>&1 | tee build/desktop-macos-packaging/platform-probe.log

      - name: Use existing credentials for the selected private operation
        if: inputs.mode != 'macos-gui-probe'
        env:
          MACOS_DISTRIBUTION_MODE: ${{ inputs.mode }}
          TARGET_ARCH: ${{ matrix.arch }}
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: bash .github/scripts/macos_signing_ci.sh

      - name: Exercise the extracted signed helper with isolated fakes
        if: inputs.mode == 'macos-packaging'
        env:
          SESORI_E2E_REQUIRED: '1'
          SESORI_DESKTOP_BRIDGE_PATH: ${{ github.workspace }}/build/desktop-macos-packaging/verified-zip/Sesori.app/Contents/Helpers/bridge/bin/bridge
          SESORI_E2E_ARTIFACT_DIR: ${{ github.workspace }}/build/desktop-macos-packaging/supervised-e2e
        run: |
          set -euo pipefail
          (cd bridge/app && dart test test/integration/supervised_e2e_test.dart --reporter expanded) \
            2>&1 | tee build/desktop-macos-packaging/supervised-e2e.log

      - name: Probe installed GUI and separately signed platform fixture
        if: inputs.mode == 'macos-packaging'
        run: |
          set -euo pipefail
          python .github/scripts/probe_desktop_macos.py \
            --app build/desktop-macos-packaging/verified-zip/Sesori.app \
            --fixture build/desktop-platform-probe/Sesori.app \
            --output build/desktop-macos-packaging/platform-probe \
            2>&1 | tee build/desktop-macos-packaging/platform-probe.log

      - name: Upload complete private packages only after verification
        if: inputs.mode == 'macos-packaging'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-packages-${{ matrix.arch }}
          path: |
            build/desktop-macos-packaging/Sesori-macos-*.dmg
            build/desktop-macos-packaging/Sesori-macos-*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload packaging diagnostics without private signing material
        if: always() && (inputs.mode == 'macos-packaging' || inputs.mode == 'macos-gui-probe')
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-evidence-${{ matrix.arch }}
          path: |
            build/desktop-qualification/*.json
            build/desktop-qualification/*.log
            build/desktop-bundle/build-source-changes.patch
            build/desktop-bundle/dart-defines.env
            build/desktop-macos-packaging/*.json
            build/desktop-macos-packaging/*.log
            build/desktop-macos-packaging/supervised-e2e/
            build/desktop-macos-packaging/platform-probe/
          if-no-files-found: warn
          retention-days: 14

  macos-upgrade:
    needs: tooling
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'macos-upgrade-probe'
    permissions:
      contents: read
      actions: read
      pull-requests: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26-intel
            arch: x64
          - runner: xcode-27
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      CI: 'true'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
      - name: Set up native Xcode
        uses: ./.github/actions/setup-xcode
      - name: Validate selected runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREVIOUS_RUN: ${{ inputs.previous_packaging_run }}
          CURRENT_RUN: ${{ inputs.packaging_run }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || {
            echo 'macOS upgrade qualification must be dispatched from main.' >&2
            exit 1
          }
          [[ "$PREVIOUS_RUN" =~ ^[1-9][0-9]*$ ]] || { echo 'Select a previous packaging run.' >&2; exit 1; }
          [[ "$CURRENT_RUN" =~ ^[1-9][0-9]*$ ]] || { echo 'Select a current packaging run.' >&2; exit 1; }
          [[ "$PREVIOUS_RUN" != "$CURRENT_RUN" ]] || { echo 'Upgrade runs must differ.' >&2; exit 1; }
          mkdir -p build/desktop-macos-upgrade/{previous,current}
          gh api "repos/$GH_REPO/actions/runs/$PREVIOUS_RUN" \
            > build/desktop-macos-upgrade/previous/run.json
          gh api "repos/$GH_REPO/actions/runs/$CURRENT_RUN" \
            > build/desktop-macos-upgrade/current/run.json
          for label in previous current; do
            source="$(jq -r .head_sha "build/desktop-macos-upgrade/$label/run.json")"
            [[ "$source" =~ ^[0-9a-f]{40}$ ]] || { echo "$label run has an invalid source SHA." >&2; exit 1; }
            gh api "repos/$GH_REPO/commits/$source/pulls" \
              > "build/desktop-macos-upgrade/$label/pulls.json"
          done
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.previous_packaging_run }}
          name: desktop-macos-packages-${{ matrix.arch }}
          path: build/desktop-macos-upgrade/previous/packages
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.previous_packaging_run }}
          name: desktop-macos-evidence-${{ matrix.arch }}
          path: build/desktop-macos-upgrade/previous/evidence
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.packaging_run }}
          name: desktop-macos-packages-${{ matrix.arch }}
          path: build/desktop-macos-upgrade/current/packages
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.packaging_run }}
          name: desktop-macos-evidence-${{ matrix.arch }}
          path: build/desktop-macos-upgrade/current/evidence
      - name: Exercise signed manual replacement through the real tray Quit path
        run: |
          python .github/scripts/qualify_desktop_macos_upgrade.py \
            --previous-run-json build/desktop-macos-upgrade/previous/run.json \
            --previous-packages build/desktop-macos-upgrade/previous/packages \
            --previous-evidence build/desktop-macos-upgrade/previous/evidence \
            --previous-pulls-json build/desktop-macos-upgrade/previous/pulls.json \
            --current-run-json build/desktop-macos-upgrade/current/run.json \
            --current-packages build/desktop-macos-upgrade/current/packages \
            --current-evidence build/desktop-macos-upgrade/current/evidence \
            --current-pulls-json build/desktop-macos-upgrade/current/pulls.json \
            --architecture '${{ matrix.arch }}' --channel '${{ inputs.channel }}' \
            --output build/desktop-macos-upgrade/result
      - name: Upload private upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-upgrade-evidence-${{ matrix.arch }}
          path: build/desktop-macos-upgrade/result/
          if-no-files-found: warn
          retention-days: 14

  linux-authenticated-upgrade:
    needs: tooling
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      inputs.mode == 'linux-authenticated-upgrade-probe'
    concurrency:
      group: desktop-authenticated-qualification
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/desktop-linux-authenticated-upgrade.yml
    with:
      previous_run: ${{ inputs.previous_packaging_run }}
      current_run: ${{ inputs.packaging_run }}
    secrets:
      SESORI_DESKTOP_QA_EMAIL: ${{ secrets.SESORI_DESKTOP_QA_EMAIL }}
      SESORI_DESKTOP_QA_PASSWORD: ${{ secrets.SESORI_DESKTOP_QA_PASSWORD }}

  macos-authenticated-upgrade:
    # Signing is automatic on main; repository QA credentials remain confined to the later exercise step.
    environment: macos-signing
    needs: tooling
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      inputs.mode == 'macos-authenticated-upgrade-probe'
    concurrency:
      group: desktop-authenticated-qualification
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pull-requests: read
    timeout-minutes: 35
    strategy:
      fail-fast: false
      # One dedicated QA account cannot own two simultaneous relay bridge slots.
      max-parallel: 1
      matrix:
        include:
          - runner: macos-26-intel
            architecture: x64
          - runner: xcode-27
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    env:
      CI: 'true'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.architecture }}
      - name: Set up native Xcode
        uses: ./.github/actions/setup-xcode
      - name: Validate selected runs on trusted main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREVIOUS_RUN: ${{ inputs.previous_packaging_run }}
          CURRENT_RUN: ${{ inputs.packaging_run }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo 'Authenticated macOS upgrade qualification must be dispatched from main.' >&2
            exit 1
          fi
          [[ "$PREVIOUS_RUN" =~ ^[1-9][0-9]*$ ]] || { echo 'Select a previous packaging run.' >&2; exit 1; }
          [[ "$CURRENT_RUN" =~ ^[1-9][0-9]*$ ]] || { echo 'Select a current packaging run.' >&2; exit 1; }
          [[ "$PREVIOUS_RUN" != "$CURRENT_RUN" ]] || { echo 'Upgrade runs must differ.' >&2; exit 1; }
          mkdir -p build/desktop-macos-authenticated-upgrade/{previous,current}
          gh api "repos/$GH_REPO/actions/runs/$PREVIOUS_RUN" \
            > build/desktop-macos-authenticated-upgrade/previous/run.json
          gh api "repos/$GH_REPO/actions/runs/$CURRENT_RUN" \
            > build/desktop-macos-authenticated-upgrade/current/run.json
          for label in previous current; do
            source="$(jq -r .head_sha "build/desktop-macos-authenticated-upgrade/$label/run.json")"
            [[ "$source" =~ ^[0-9a-f]{40}$ ]] || { echo "$label run has an invalid source SHA." >&2; exit 1; }
            gh api "repos/$GH_REPO/commits/$source/pulls" \
              > "build/desktop-macos-authenticated-upgrade/$label/pulls.json"
          done
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.previous_packaging_run }}
          name: desktop-macos-packages-${{ matrix.architecture }}
          path: build/desktop-macos-authenticated-upgrade/previous/packages
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.previous_packaging_run }}
          name: desktop-macos-evidence-${{ matrix.architecture }}
          path: build/desktop-macos-authenticated-upgrade/previous/evidence
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.packaging_run }}
          name: desktop-macos-packages-${{ matrix.architecture }}
          path: build/desktop-macos-authenticated-upgrade/current/packages
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.packaging_run }}
          name: desktop-macos-evidence-${{ matrix.architecture }}
          path: build/desktop-macos-authenticated-upgrade/current/evidence
      - name: Sign the QA-only Keychain helper with the existing Developer ID
        timeout-minutes: 3
        env:
          MACOS_DISTRIBUTION_MODE: macos-authenticated-upgrade-probe
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: bash .github/scripts/macos_signing_ci.sh
      - name: Exercise authenticated helper-On replacement and tray Quit
        # Keep upload headroom within the 35m job, including the separate 3m signing step.
        timeout-minutes: 20
        env:
          CHANNEL: ${{ inputs.channel }}
          SESORI_DESKTOP_QA_EMAIL: ${{ secrets.SESORI_DESKTOP_QA_EMAIL }}
          SESORI_DESKTOP_QA_PASSWORD: ${{ secrets.SESORI_DESKTOP_QA_PASSWORD }}
        run: |
          python .github/scripts/qualify_desktop_macos_authenticated_upgrade.py \
            --previous-run-json build/desktop-macos-authenticated-upgrade/previous/run.json \
            --previous-packages build/desktop-macos-authenticated-upgrade/previous/packages \
            --previous-evidence build/desktop-macos-authenticated-upgrade/previous/evidence \
            --previous-pulls-json build/desktop-macos-authenticated-upgrade/previous/pulls.json \
            --current-run-json build/desktop-macos-authenticated-upgrade/current/run.json \
            --current-packages build/desktop-macos-authenticated-upgrade/current/packages \
            --current-evidence build/desktop-macos-authenticated-upgrade/current/evidence \
            --current-pulls-json build/desktop-macos-authenticated-upgrade/current/pulls.json \
            --keychain-writer build/desktop-macos-authenticated-upgrade/tools/keychain-writer \
            --architecture '${{ matrix.architecture }}' --channel "$CHANNEL" \
            --output build/desktop-macos-authenticated-upgrade/result
      - name: Upload bounded private authenticated upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-authenticated-upgrade-evidence-${{ matrix.architecture }}
          path: build/desktop-macos-authenticated-upgrade/result/
          if-no-files-found: warn
          retention-days: 14

  windows-distribution:
    needs: tooling
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'windows-packaging'
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      PUB_CACHE: ${{ github.workspace }}/../desktop-qualification-pub-cache
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
      # Runs Velopack's vpk, which the packager installs from its pinned, checksum-verified package.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Bootstrap pinned native SDK
        env:
          SDK_DIR: ${{ runner.temp }}/desktop-qualification-flutter
        run: |
          set -euo pipefail
          mkdir -p build/desktop-qualification
          python .github/scripts/qualify_desktop.py bootstrap --arch '${{ matrix.arch }}' --sdk-dir "$SDK_DIR" \
            2>&1 | tee build/desktop-qualification/bootstrap.log
      - name: Build exact native GUI and helper bundle
        env:
          BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          (cd bridge && dart pub get --enforce-lockfile) 2>&1 | tee build/desktop-qualification/bridge-pub.log
          (cd client && flutter pub get --enforce-lockfile) 2>&1 | tee build/desktop-qualification/client-pub.log
          VERSION="$(awk '/^version:/{print $2; exit}' client/desktop/pubspec.yaml)"
          echo "SESORI_WINDOWS_VERSION=${VERSION%%+*}" >> "$GITHUB_ENV"
          (cd client/desktop && dart run tool/stage_desktop_bundle.dart \
            --build-number "$BUILD_NUMBER" --channel "$CHANNEL" \
            --output '${{ github.workspace }}/build/desktop-bundle') \
            2>&1 | tee build/desktop-qualification/bundle-build.log
          if [[ -s build/desktop-bundle/build-source-changes.patch ]]; then
            echo 'Commit build-generated source changes before installer compilation.' >&2
            exit 1
          fi
      - name: Pack unsigned private Velopack installer from verified bundle with pinned vpk
        run: |
          set -euo pipefail
          python .github/scripts/package_desktop_windows.py package \
            --bundle build/desktop-bundle/bundle --arch '${{ matrix.arch }}' \
            --version "$SESORI_WINDOWS_VERSION" \
            --output build/desktop-windows-packaging \
            2>&1 | tee build/desktop-qualification/windows-packaging.log
      - name: Probe isolated install, same-version reinstall and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Resolve-Path "build/desktop-windows-packaging/Sesori-windows-${{ matrix.arch }}-$env:SESORI_WINDOWS_VERSION.exe"
          $install = Join-Path $env:RUNNER_TEMP 'Sesori isolated install'
          $current = Join-Path $install 'current'
          $shared = Join-Path $env:LOCALAPPDATA 'sesori'
          New-Item -ItemType Directory -Path $shared -Force | Out-Null
          Set-Content -Path (Join-Path $shared 'keep.txt') -Value 'preserve'
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          New-Item -Path $runKey -Force | Out-Null
          New-ItemProperty -Path $runKey -Name Sesori -Value 'preexisting-login-intent' -PropertyType String -Force | Out-Null
          # Start-Process joins arguments with spaces, so paths keep their own quotes.
          $logs = (Resolve-Path 'build/desktop-windows-packaging').Path
          $arguments = @('--silent', '--installto', "`"$install`"", '--log')
          $installed = Start-Process -FilePath $package -ArgumentList ($arguments + "`"$logs\setup-install.log`"") -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "Install failed: $($installed.ExitCode)" }
          $upgraded = Start-Process -FilePath $package -ArgumentList ($arguments + "`"$logs\setup-reinstall.log`"") -Wait -PassThru
          if ($upgraded.ExitCode -ne 0) { throw "Upgrade failed: $($upgraded.ExitCode)" }
          if ((Get-ItemPropertyValue -Path $runKey -Name Sesori) -ne 'preexisting-login-intent') {
            throw 'Install or upgrade changed login intent'
          }
          python .github/scripts/package_desktop_windows.py verify --bundle $current --arch '${{ matrix.arch }}' --version $env:SESORI_WINDOWS_VERSION |
            Set-Content -Encoding utf8 build/desktop-windows-packaging/installed-inventory.json
          if ($LASTEXITCODE -ne 0) { throw 'Installed payload verification failed' }
          $stagedRoot = (Resolve-Path 'build/desktop-bundle/bundle').Path
          $recordedPayload = Get-ChildItem $stagedRoot -File -Recurse | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath($stagedRoot, $_.FullName)
            $installedPath = Join-Path $current $relative
            if (-not (Test-Path $installedPath -PathType Leaf)) { throw "Installed payload missing: $relative" }
            $stagedHash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            $installedHash = (Get-FileHash $installedPath -Algorithm SHA256).Hash
            if ($stagedHash -ne $installedHash) { throw "Installed payload hash mismatch: $relative" }
            [PSCustomObject]@{ relativePath = $relative; sha256 = $stagedHash.ToLowerInvariant() }
          }
          $recordedPaths = [Collections.Generic.HashSet[string]]::new(
            [string[]]($recordedPayload | ForEach-Object { $_.relativePath }),
            [StringComparer]::OrdinalIgnoreCase
          )
          # Velopack adds only its manifest to current\; its updater, launcher and package sit in the install root.
          $unexpectedInstalled = Get-ChildItem $current -File -Recurse | Where-Object {
            $relative = [IO.Path]::GetRelativePath($current, $_.FullName)
            -not $recordedPaths.Contains($relative) -and $relative -ne 'sq.version'
          }
          if ($unexpectedInstalled) {
            throw "Unexpected installed payload: $($unexpectedInstalled.FullName -join ', ')"
          }
          $uninstaller = Join-Path $install 'Update.exe'
          $removed = Start-Process -FilePath $uninstaller -ArgumentList @('uninstall', '--silent') -Wait -PassThru
          if ($removed.ExitCode -ne 0) { throw "Uninstall failed: $($removed.ExitCode)" }
          foreach ($payload in $recordedPayload) {
            if (Test-Path (Join-Path $current $payload.relativePath)) {
              throw "Recorded payload remains: $($payload.relativePath)"
            }
          }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\sesori-desktop') {
            throw 'Uninstall entry remains after uninstall'
          }
          if (Get-ItemProperty -Path $runKey -Name Sesori -ErrorAction SilentlyContinue) { throw 'Login value remains after uninstall' }
          if ((Get-Content (Join-Path $shared 'keep.txt')) -ne 'preserve') { throw 'Shared sentinel changed' }
          @{
            architecture = '${{ matrix.arch }}'
            installedPayloadVerified = $true
            sameVersionUpgradeVerified = $true
            uninstallRemovedPayloadAndLoginValue = $true
            proofBoundary = 'Silent fixture only; Velopack stops running app processes itself, which is not exercised. Not interactive GUI, account, SmartScreen, signing, update, or product QA'
          } | ConvertTo-Json | Set-Content -Encoding utf8 build/desktop-windows-packaging/installer-probe.json
      - name: Upload private unsigned installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-packages-${{ matrix.arch }}
          path: build/desktop-windows-packaging/Sesori-windows-*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload the unpublished Velopack release package and feed
        uses: actions/upload-artifact@v4
        with:
          # Outside the desktop-windows-* pattern, so no release consumer downloads it.
          name: desktop-velopack-windows-${{ matrix.arch }}
          path: build/desktop-windows-packaging/velopack/
          if-no-files-found: error
          retention-days: 14
      - name: Upload qualification evidence, including partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-evidence-${{ matrix.arch }}
          path: |
            build/desktop-qualification/*.log
            build/desktop-bundle/build-source-changes.patch
            build/desktop-bundle/bundle/bridge/desktop-bundle.json
            build/desktop-windows-packaging/*.json
            build/desktop-windows-packaging/*.log
          if-no-files-found: warn
          retention-days: 14

  linux-distribution:
    environment: linux-signing
    needs: tooling
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'linux-packaging'
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            machine: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      PUB_CACHE: ${{ github.workspace }}/../desktop-qualification-pub-cache
      # Base filesystem indexes are pinned for both native CPUs. apt/dnf repositories remain rolling.
      UBUNTU_IMAGE: docker.io/library/ubuntu@sha256:69cecf4bbf72d2d44a9eef1b71fb98c7fb973d78af11399deccef19beb008ad9
      DEBIAN_IMAGE: docker.io/library/debian@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1
    defaults:
      run:
        shell: bash
    steps:
      - name: Require main before signed Linux qualification
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Linux signing requires main'; exit 1; }
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require trusted committed Linux product source
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          git merge-base --is-ancestor HEAD origin/main
          printf '%s\n' '/.ci-workflow/' >> "$(git rev-parse --git-path info/exclude)"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .ci-workflow
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
      # Runs Velopack's vpk, which the AppImage packager installs from its pinned, checksum-verified package.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Refuse emulated host and install native build dependencies
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == '${{ matrix.machine }}' ]] || { echo 'Native runner architecture mismatch'; exit 1; }
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libsecret-1-dev libx11-dev libxi-dev dpkg-dev squashfs-tools
      - name: Bootstrap pinned native SDK
        env:
          SDK_DIR: ${{ runner.temp }}/desktop-qualification-flutter
        run: |
          set -euo pipefail
          mkdir -p build/desktop-qualification build/desktop-linux-packaging
          python .github/scripts/qualify_desktop.py bootstrap --arch '${{ matrix.arch }}' --sdk-dir "$SDK_DIR" \
            2>&1 | tee build/desktop-qualification/bootstrap.log
      - name: Build and stage complete native bundle
        env:
          BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          (cd bridge && dart pub get --enforce-lockfile) 2>&1 | tee build/desktop-qualification/bridge-pub.log
          (cd client && flutter pub get --enforce-lockfile) 2>&1 | tee build/desktop-qualification/client-pub.log
          (cd client/desktop && dart run tool/stage_desktop_bundle.dart \
            --build-number "$BUILD_NUMBER" --channel "$CHANNEL" \
            --output '${{ github.workspace }}/build/desktop-bundle') \
            2>&1 | tee build/desktop-qualification/bundle-build.log
          if [[ -s build/desktop-bundle/build-source-changes.patch ]]; then
            echo 'Commit build-generated source changes before package construction.' >&2
            exit 1
          fi
      - name: Build native DEB with generated shared-library dependencies
        run: |
          set -euo pipefail
          python .github/scripts/package_desktop_linux.py package \
            --bundle build/desktop-bundle/bundle --arch '${{ matrix.arch }}' --format deb \
            --package-config client/.dart_tool/package_config.json \
            --output build/desktop-linux-packaging/deb \
            2>&1 | tee build/desktop-linux-packaging/deb-packaging.log
      - name: Build portable AppImage and its Velopack release with pinned vpk
        run: |
          set -euo pipefail
          python .github/scripts/package_desktop_linux.py package \
            --bundle build/desktop-bundle/bundle --arch '${{ matrix.arch }}' --format appimage \
            --package-config client/.dart_tool/package_config.json \
            --output build/desktop-linux-packaging/appimage \
            2>&1 | tee build/desktop-linux-packaging/appimage-packaging.log
      - name: Resolve the shared Fedora base from the signing Dockerfile
        run: |
          image="$(awk '/^FROM / {print $2}' .ci-workflow/.github/scripts/Dockerfile.linux-signing)"
          echo "FEDORA_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Pull validated official Fedora and build native RPM there
        run: |
          set -euo pipefail
          docker pull "$FEDORA_IMAGE" 2>&1 | tee build/desktop-linux-packaging/fedora-pull.log
          docker image inspect --format '{{ join .RepoDigests "\n" }}' "$FEDORA_IMAGE" | \
            grep -Fx "$FEDORA_IMAGE"
          [[ "$(docker run --rm "$FEDORA_IMAGE" uname -m)" == '${{ matrix.machine }}' ]] || {
            echo 'Fedora container architecture differs from native host'; exit 1;
          }
          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$PUB_CACHE:$PUB_CACHE:ro" \
            -w "$GITHUB_WORKSPACE" "$FEDORA_IMAGE" bash -c '
              set -euo pipefail
              dnf install -y python3 rpm-build git
              git config --global --add safe.directory "$PWD"
              python3 .github/scripts/package_desktop_linux.py package \
                --bundle build/desktop-bundle/bundle --arch "${{ matrix.arch }}" --format rpm \
                --package-config client/.dart_tool/package_config.json \
                --output build/desktop-linux-packaging/rpm
            ' 2>&1 | tee build/desktop-linux-packaging/rpm-packaging.log
      - name: Build Linux signing tools without secrets
        run: |
          set -euo pipefail
          docker build --file .ci-workflow/.github/scripts/Dockerfile.linux-signing \
            --tag sesori-linux-signing .ci-workflow/.github/scripts
      - name: Sign and verify qualified Linux packages
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
          LINUX_GPG_FINGERPRINT: ${{ vars.LINUX_GPG_FINGERPRINT }}
        run: |
          set -euo pipefail
          # Only this step receives credentials and passes them into the network-disabled container.
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE/.ci-workflow/.github/scripts:/scripts:ro" \
            -v "$GITHUB_WORKSPACE/build/desktop-linux-packaging:/packages" \
            -e LINUX_GPG_PRIVATE_KEY -e LINUX_GPG_PASSPHRASE -e LINUX_GPG_FINGERPRINT \
            sesori-linux-signing python3 /scripts/sign_desktop_linux.py \
              --root /packages --output /packages/signed
      - name: Install, same-version reinstall and remove DEB on native Ubuntu and Debian
        run: |
          set -euo pipefail
          package="$(realpath build/desktop-linux-packaging/signed/*.deb)"
          bundle="$(realpath build/desktop-bundle/bundle)"
          for fixture in "ubuntu-24.04|$UBUNTU_IMAGE" "debian-13|$DEBIAN_IMAGE"; do
            IFS='|' read -r name image <<<"$fixture"
            docker pull "$image" 2>&1 | tee "build/desktop-linux-packaging/${name}-pull.log"
            # Pulling by digest enforces content identity; Docker normalizes Hub repository names.
            docker image inspect --format '{{ join .RepoDigests "\n" }}' "$image" | \
              tee "build/desktop-linux-packaging/${name}-image.log"
            [[ "$(docker run --rm "$image" uname -m)" == '${{ matrix.machine }}' ]] || {
              echo "$name container architecture differs from native host"; exit 1;
            }
            docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" "$image" bash -c "
              set -euo pipefail
              apt-get update && apt-get install -y python3 gnupg
              .ci-workflow/.github/scripts/qualify_desktop_linux_package.sh deb '$package' '$bundle' \
                '${{ matrix.arch }}' 'build/desktop-linux-packaging/${name}-fixture.json'
            " 2>&1 | tee "build/desktop-linux-packaging/${name}-fixture.log"
          done
      - name: Install, same-version reinstall and remove RPM on native Fedora
        run: |
          set -euo pipefail
          package="$(realpath build/desktop-linux-packaging/signed/*.rpm)"
          bundle="$(realpath build/desktop-bundle/bundle)"
          docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            "$FEDORA_IMAGE" bash -c "
              set -euo pipefail
              dnf install -y python3 gnupg2
              .ci-workflow/.github/scripts/qualify_desktop_linux_package.sh rpm '$package' '$bundle' \
                '${{ matrix.arch }}' 'build/desktop-linux-packaging/fedora-44-fixture.json'
            " 2>&1 | tee build/desktop-linux-packaging/fedora-44-fixture.log
      - name: Upload private signed packages
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-packages-${{ matrix.arch }}
          path: |
            build/desktop-linux-packaging/signed/*.deb
            build/desktop-linux-packaging/signed/*.rpm
            build/desktop-linux-packaging/signed/*.AppImage
            build/desktop-linux-packaging/signed/*.asc
            build/desktop-linux-packaging/signed/desktop-linux-checksums.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload the unpublished Velopack release package and feed
        uses: actions/upload-artifact@v4
        with:
          # Outside the desktop-linux-* pattern, so release and session consumers never download it.
          name: desktop-velopack-linux-${{ matrix.arch }}
          path: build/desktop-linux-packaging/appimage/velopack/
          # Product sources from before Velopack packaging produce none.
          if-no-files-found: warn
          retention-days: 14
      - name: Upload qualification evidence, including partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-evidence-${{ matrix.arch }}
          path: |
            build/desktop-qualification/*.log
            build/desktop-bundle/build-source-changes.patch
            build/desktop-bundle/dart-defines.env
            build/desktop-bundle/bundle/bridge/desktop-bundle.json
            build/desktop-linux-packaging/*.json
            build/desktop-linux-packaging/*.log
            build/desktop-linux-packaging/*/packaging.json
            build/desktop-linux-packaging/signed/signing.json
          if-no-files-found: warn
          retention-days: 14

  tooling:
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'linux-interactive-debug'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s .github/scripts -p 'test_*desktop*.py'
      - name: Verify real Linux signatures with a disposable subkey
        run: |
          set -euo pipefail
          docker build --file .github/scripts/Dockerfile.linux-signing --tag sesori-linux-signing .github/scripts
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -e SESORI_LINUX_SIGNING_TEST_REQUIRED=1 sesori-linux-signing \
            python3 -m unittest discover -s .github/scripts -p 'test_sign_desktop_linux.py'
          docker build --file .github/scripts/Dockerfile.linux-repository \
            --tag sesori-linux-repository .github/scripts
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -e SESORI_LINUX_SIGNING_TEST_REQUIRED=1 sesori-linux-repository \
            python3 -m unittest discover -s .github/scripts -p 'test_build_linux_repository.py'

  macos-native-build:
    # Retain native check names while the GUI compiler runs in the ARM producer.
    name: native-build (${{ matrix.runner }}, macos, ${{ matrix.arch }})
    needs: [tooling, macos-gui]
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'native-builds'
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26-intel
            arch: x64
          - runner: xcode-27
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      PUB_CACHE: ${{ github.workspace }}/../desktop-qualification-pub-cache
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .ci-workflow
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
      - name: Set up native Xcode
        uses: ./.ci-workflow/.github/actions/setup-xcode
      - name: Verify native codesign requirement controls
        run: python -m unittest discover -s .github/scripts -p test_macos_signing_workflows.py
      - name: Bootstrap exact official native Flutter revision
        env:
          SDK_DIR: ${{ runner.temp }}/desktop-qualification-flutter
        run: |
          set -euo pipefail
          mkdir -p build/desktop-qualification
          python .github/scripts/qualify_desktop.py bootstrap --arch '${{ matrix.arch }}' --sdk-dir "$SDK_DIR" \
            2>&1 | tee build/desktop-qualification/bootstrap.log
      - name: Typecheck supported Sparkle lifecycle API
        run: |
          set -euo pipefail
          cd build/desktop-qualification
          curl --fail --location --output Sparkle.tar.xz \
            https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz
          echo 'c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c  Sparkle.tar.xz' |
            shasum --algorithm 256 --check
          mkdir sparkle
          tar -xf Sparkle.tar.xz -C sparkle
          xcrun swiftc -typecheck -F sparkle ../../.github/scripts/probe_sparkle.swift \
            2>&1 | tee sparkle-api.log
          echo 'Sparkle 2.10.0 public API typecheck passed; runtime update behavior remains unverified.' \
            >> sparkle-api.log
      - name: Resolve locked workspaces
        run: |
          set -euo pipefail
          printf '%s\n' '/.ci-workflow/' >> "$(git rev-parse --git-path info/exclude)"
          (cd bridge && dart pub get --enforce-lockfile) 2>&1 | tee build/desktop-qualification/bridge-pub.log
          (cd client && flutter pub get --enforce-lockfile) 2>&1 | tee build/desktop-qualification/client-pub.log
      - uses: actions/download-artifact@v4
        with:
          name: desktop-macos-gui-${{ matrix.arch }}
          path: build/macos-gui-input
      - name: Assemble ARM-built GUI with native helper
        run: |
          set -euo pipefail
          tar -xzf 'build/macos-gui-input/macos-gui-${{ matrix.arch }}.tar.gz' -C build
          cp build/desktop-macos-gui/product/gui-inventory.json build/desktop-qualification/product-gui-inventory.json
          cp build/desktop-macos-gui/probe/gui-inventory.json build/desktop-qualification/probe-gui-inventory.json
          cp build/desktop-macos-gui/gui-sdk.json build/desktop-qualification/gui-sdk.json
          dart --packages="$GITHUB_WORKSPACE/client/.dart_tool/package_config.json" \
            .ci-workflow/client/desktop/tool/stage_desktop_bundle.dart \
            --source-root "$GITHUB_WORKSPACE" --mode assemble --gui-input build/desktop-macos-gui/product \
            --build-number '${{ github.run_number }}' --output build/desktop-qualification/staged \
            2>&1 | tee build/desktop-qualification/bundle-build.log
      - name: Inspect staged native assets and relocated helper
        run: |
          python .github/scripts/qualify_desktop.py inspect --arch '${{ matrix.arch }}' \
            --bundle-dir build/desktop-qualification/staged/Sesori.app
      - name: Exercise relocated helper with isolated local fakes
        env:
          SESORI_E2E_REQUIRED: '1'
          SESORI_E2E_ARTIFACT_DIR: ${{ github.workspace }}/build/desktop-qualification/supervised-e2e
        run: |
          set -euo pipefail
          (cd bridge/app && dart test test/integration/supervised_e2e_test.dart --reporter expanded) \
            2>&1 | tee build/desktop-qualification/supervised-e2e.log
      - name: Preserve source diagnostics when qualification fails
        if: failure()
        run: |
          mkdir -p build/desktop-qualification
          git diff HEAD > build/desktop-qualification/failed-source-changes.patch
          git status --short > build/desktop-qualification/failed-source-status.log
      - name: Upload qualification evidence, including partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-qualification-macos-${{ matrix.arch }}
          path: |
            build/desktop-qualification/*.json
            build/desktop-qualification/*.log
            build/desktop-qualification/*.patch
            build/desktop-qualification/supervised-e2e/
            build/desktop-qualification/staged/build-source-changes.patch
            build/desktop-qualification/staged/**/desktop-bundle.json
          if-no-files-found: warn
          retention-days: 14

  native-build:
    needs: tooling
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'native-builds'
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: windows
            arch: x64
          - runner: windows-11-arm
            target: windows
            arch: arm64
          - runner: ubuntu-24.04
            target: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            target: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      # Keep dependency downloads outside the producer's clean source checkout.
      PUB_CACHE: ${{ github.workspace }}/../desktop-qualification-pub-cache
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}

      # Official pinned framework source bootstraps native Dart on each host.
      # Windows/Linux ARM64 have no prepacked Flutter SDK for the current pin.
      # A missing native bootstrap or x64 fallback fails, rather than passing via emulation.
      - name: Bootstrap exact official Flutter revision
        env:
          SDK_DIR: ${{ runner.temp }}/desktop-qualification-flutter
        run: |
          set -euo pipefail
          mkdir -p build/desktop-qualification
          python .github/scripts/qualify_desktop.py bootstrap --arch '${{ matrix.arch }}' --sdk-dir "$SDK_DIR" \
            2>&1 | tee build/desktop-qualification/bootstrap.log

      - name: Install Linux native build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libsecret-1-dev libx11-dev libxi-dev

      - name: Resolve locked workspaces
        run: |
          set -euo pipefail
          (cd bridge && dart pub get --enforce-lockfile) 2>&1 | tee build/desktop-qualification/bridge-pub.log
          # Fresh source SDKs need Flutter to populate sky_engine before resolving SDK dependencies.
          (cd client && flutter pub get --enforce-lockfile) 2>&1 | tee build/desktop-qualification/client-pub.log

      - name: Build and stage the identity-bound native desktop bundle
        run: |
          set -euo pipefail
          (cd client/desktop && dart run tool/stage_desktop_bundle.dart \
            --build-number '${{ github.run_number }}' \
            --output '${{ github.workspace }}/build/desktop-qualification/staged') \
            2>&1 | tee build/desktop-qualification/bundle-build.log

      - name: Inspect staged native assets and relocated helper
        run: |
          python .github/scripts/qualify_desktop.py inspect --arch '${{ matrix.arch }}' \
            --bundle-dir build/desktop-qualification/staged/bundle

      - name: Exercise relocated helper with isolated local fakes
        env:
          SESORI_E2E_REQUIRED: '1'
          SESORI_E2E_ARTIFACT_DIR: ${{ github.workspace }}/build/desktop-qualification/supervised-e2e
        run: |
          set -euo pipefail
          (cd bridge/app && dart test test/integration/supervised_e2e_test.dart --reporter expanded) \
            2>&1 | tee build/desktop-qualification/supervised-e2e.log

      - name: Preserve source diagnostics when qualification fails
        if: failure()
        run: |
          mkdir -p build/desktop-qualification
          git diff HEAD > build/desktop-qualification/failed-source-changes.patch
          {
            git status --short
            git diff --ignore-cr-at-eol --stat HEAD
            git ls-files --eol '*generated_plugin_registrant.*' '*generated_plugins.cmake' '*GeneratedPluginRegistrant.*'
            git config --show-origin --get core.autocrlf || echo 'core.autocrlf unset'
          } > build/desktop-qualification/failed-source-status.log

      - name: Upload qualification evidence, including partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-qualification-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            build/desktop-qualification/*.json
            build/desktop-qualification/*.log
            build/desktop-qualification/*.patch
            build/desktop-qualification/supervised-e2e/
            build/desktop-qualification/staged/build-source-changes.patch
            build/desktop-qualification/staged/**/desktop-bundle.json
          if-no-files-found: warn
          retention-days: 14
