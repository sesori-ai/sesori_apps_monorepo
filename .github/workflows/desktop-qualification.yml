name: Desktop Native Qualification

# Default qualification: no signing credentials, release tags, publication or GUI launch.
# Explicit manual macOS modes verify credentials or produce private notarized test artifacts.
# Targeted SDK/tooling qualification, NOT another full-source PR CI matrix.
# Product source changes remain covered by desktop-ci.yml and explicit packaged release gates.
# This intentionally does not gate the independent CLI/mobile release workflows.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Qualification mode (no product publication)'
        type: choice
        options: [native-builds, macos-signing-preflight, macos-packaging, macos-gui-probe, windows-packaging]
        default: native-builds
      channel:
        description: 'Compiled download channel (macos-packaging only)'
        type: choice
        options: [stable, internal]
        default: stable
      packaging_run:
        description: 'Successful trusted packaging run to inspect (macos-gui-probe only)'
        type: string
  pull_request:
    paths:
      - '.github/workflows/desktop-qualification.yml'
      - '.github/scripts/qualify_desktop.py'
      - '.github/scripts/test_qualify_desktop.py'
      - '.github/scripts/package_desktop_macos.py'
      - '.github/scripts/test_package_desktop_macos.py'
      - '.github/scripts/package_desktop_windows.py'
      - '.github/scripts/test_package_desktop_windows.py'
      - 'client/desktop/tool/windows_installer.iss'
      - 'client/desktop/windows/runner/main.cpp'
      - '.github/scripts/macos_signing_ci.sh'
      - '.github/scripts/probe_sparkle.swift'
      - '.github/scripts/probe_desktop_macos.py'
      - '.github/scripts/test_probe_desktop_macos.py'
      - '.github/scripts/inspect_desktop_macos_window.swift'
      - 'client/desktop/test/native/packaged_platform_probe.dart'
      - '.tool-versions'
      - 'client/desktop/tool/stage_desktop_bundle.dart'
      - 'client/module_desktop_core/lib/src/foundation/models/desktop_bundle_identity.dart'

permissions:
  contents: read

concurrency:
  group: desktop-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos-distribution:
    needs: tooling
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.mode == 'macos-signing-preflight' || inputs.mode == 'macos-packaging' || inputs.mode == 'macos-gui-probe')
    permissions:
      contents: read
      actions: read
    timeout-minutes: ${{ inputs.mode == 'macos-packaging' && 75 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26-intel
            arch: x64
          - runner: macos-26
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      PUB_CACHE: ${{ github.workspace }}/../desktop-qualification-pub-cache
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
      - name: Select qualified Xcode
        run: echo 'DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer' >> "$GITHUB_ENV"

      - name: Bootstrap pinned native SDK and stage committed source
        if: inputs.mode == 'macos-packaging'
        env:
          SDK_DIR: ${{ runner.temp }}/desktop-qualification-flutter
        run: |
          set -euo pipefail
          mkdir -p build/desktop-qualification
          python .github/scripts/qualify_desktop.py bootstrap --arch '${{ matrix.arch }}' --sdk-dir "$SDK_DIR" \
            2>&1 | tee build/desktop-qualification/bootstrap.log
          # GITHUB_PATH additions take effect in the next step; use this SDK explicitly here.
          export PATH="$SDK_DIR/bin:$PATH"
          (cd bridge && dart pub get --enforce-lockfile) 2>&1 | tee build/desktop-qualification/bridge-pub.log
          (cd client && flutter pub get --enforce-lockfile) 2>&1 | tee build/desktop-qualification/client-pub.log
          (cd client/desktop && dart run tool/stage_desktop_bundle.dart \
            --build-number '${{ github.run_number }}' --channel '${{ inputs.channel }}' \
            --output '${{ github.workspace }}/build/desktop-bundle') \
            2>&1 | tee build/desktop-qualification/bundle-build.log
          if [[ -s build/desktop-bundle/build-source-changes.patch ]]; then
            echo 'Commit build-generated source changes before signing; see build-source-changes.patch.' >&2
            exit 1
          fi
          # Separate release fixture: never replace the staged product or upload this as a package.
          (cd client/desktop && flutter build macos --release --no-pub \
            --target test/native/packaged_platform_probe.dart) \
            2>&1 | tee build/desktop-qualification/platform-probe-build.log
          ditto client/desktop/build/macos/Build/Products/Release/Sesori.app build/desktop-platform-probe/Sesori.app

      - name: Validate GUI-only artifact selection
        if: inputs.mode == 'macos-gui-probe'
        env:
          PACKAGING_RUN: ${{ inputs.packaging_run }}
        run: |
          [[ "$PACKAGING_RUN" =~ ^[1-9][0-9]*$ ]] || { echo 'Select a trusted successful packaging run'; exit 1; }

      - uses: actions/download-artifact@v4
        if: inputs.mode == 'macos-gui-probe'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.packaging_run }}
          name: desktop-macos-packages-${{ matrix.arch }}
          path: build/desktop-gui-download

      - name: Re-probe the existing signed GUI without rebuilding or signing
        if: inputs.mode == 'macos-gui-probe'
        run: |
          set -euo pipefail
          mkdir -p build/desktop-macos-packaging
          ditto -xk 'build/desktop-gui-download/Sesori-macos-${{ matrix.arch }}.zip' build/desktop-gui-download/expanded
          python .github/scripts/probe_desktop_macos.py \
            --app build/desktop-gui-download/expanded/Sesori.app \
            --output build/desktop-macos-packaging/platform-probe \
            2>&1 | tee build/desktop-macos-packaging/platform-probe.log

      - name: Use existing credentials for the selected private operation
        if: inputs.mode != 'macos-gui-probe'
        env:
          MACOS_DISTRIBUTION_MODE: ${{ inputs.mode }}
          TARGET_ARCH: ${{ matrix.arch }}
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: bash .github/scripts/macos_signing_ci.sh

      - name: Exercise the extracted signed helper with isolated fakes
        if: inputs.mode == 'macos-packaging'
        env:
          SESORI_E2E_REQUIRED: '1'
          SESORI_DESKTOP_BRIDGE_PATH: ${{ github.workspace }}/build/desktop-macos-packaging/verified-zip/Sesori.app/Contents/Helpers/bridge/bin/bridge
          SESORI_E2E_ARTIFACT_DIR: ${{ github.workspace }}/build/desktop-macos-packaging/supervised-e2e
        run: |
          set -euo pipefail
          (cd bridge/app && dart test test/integration/supervised_e2e_test.dart --reporter expanded) \
            2>&1 | tee build/desktop-macos-packaging/supervised-e2e.log

      - name: Probe installed GUI and separately signed platform fixture
        if: inputs.mode == 'macos-packaging'
        run: |
          set -euo pipefail
          python .github/scripts/probe_desktop_macos.py \
            --app build/desktop-macos-packaging/verified-zip/Sesori.app \
            --fixture build/desktop-platform-probe/Sesori.app \
            --output build/desktop-macos-packaging/platform-probe \
            2>&1 | tee build/desktop-macos-packaging/platform-probe.log

      - name: Upload complete private packages only after verification
        if: inputs.mode == 'macos-packaging'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-packages-${{ matrix.arch }}
          path: |
            build/desktop-macos-packaging/Sesori-macos-*.dmg
            build/desktop-macos-packaging/Sesori-macos-*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload packaging diagnostics without private signing material
        if: always() && (inputs.mode == 'macos-packaging' || inputs.mode == 'macos-gui-probe')
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-evidence-${{ matrix.arch }}
          path: |
            build/desktop-qualification/*.json
            build/desktop-qualification/*.log
            build/desktop-bundle/build-source-changes.patch
            build/desktop-bundle/dart-defines.env
            build/desktop-macos-packaging/*.json
            build/desktop-macos-packaging/*.log
            build/desktop-macos-packaging/supervised-e2e/
            build/desktop-macos-packaging/platform-probe/
          if-no-files-found: warn
          retention-days: 14

  windows-distribution:
    needs: tooling
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'windows-packaging'
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      PUB_CACHE: ${{ github.workspace }}/../desktop-qualification-pub-cache
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
      - name: Bootstrap pinned native SDK
        env:
          SDK_DIR: ${{ runner.temp }}/desktop-qualification-flutter
        run: |
          set -euo pipefail
          mkdir -p build/desktop-qualification
          python .github/scripts/qualify_desktop.py bootstrap --arch '${{ matrix.arch }}' --sdk-dir "$SDK_DIR" \
            2>&1 | tee build/desktop-qualification/bootstrap.log
      - name: Build exact native GUI and helper bundle
        run: |
          set -euo pipefail
          (cd bridge && dart pub get --enforce-lockfile) 2>&1 | tee build/desktop-qualification/bridge-pub.log
          (cd client && flutter pub get --enforce-lockfile) 2>&1 | tee build/desktop-qualification/client-pub.log
          VERSION="$(awk '/^version:/{print $2; exit}' client/desktop/pubspec.yaml)"
          echo "SESORI_WINDOWS_VERSION=${VERSION%%+*}" >> "$GITHUB_ENV"
          (cd client/desktop && dart run tool/stage_desktop_bundle.dart \
            --build-number '${{ github.run_number }}' --output '${{ github.workspace }}/build/desktop-bundle') \
            2>&1 | tee build/desktop-qualification/bundle-build.log
          if [[ -s build/desktop-bundle/build-source-changes.patch ]]; then
            echo 'Commit build-generated source changes before installer compilation.' >&2
            exit 1
          fi
      - name: Acquire pinned official Inno Setup compiler
        shell: pwsh
        timeout-minutes: 10
        env:
          INNO_DIR: ${{ runner.temp }}/inno-setup-7.1.0
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $asset
          if ((Get-FileHash $asset -Algorithm SHA256).Hash -ne '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f') {
            throw 'Inno compiler download hash mismatch'
          }
          # PowerShell preserves Inno switches; Git Bash can rewrite /VERYSILENT as a path.
          # Compiler/installer launcher emulation only is approved on ARM64.
          $log = Join-Path $env:GITHUB_WORKSPACE 'build/desktop-qualification/inno-install.log'
          $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$env:INNO_DIR`"", "/LOG=`"$log`"")
          $installed = Start-Process -FilePath $asset -ArgumentList $arguments -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "Inno compiler install failed: $($installed.ExitCode)" }
          "SESORI_ISCC=$(Join-Path $env:INNO_DIR 'ISCC.exe')" >> $env:GITHUB_ENV
      - name: Compile unsigned private installer from verified bundle
        run: |
          set -euo pipefail
          python .github/scripts/package_desktop_windows.py package \
            --bundle build/desktop-bundle/bundle --arch '${{ matrix.arch }}' \
            --version "$SESORI_WINDOWS_VERSION" --iscc "$SESORI_ISCC" \
            --output build/desktop-windows-packaging \
            2>&1 | tee build/desktop-qualification/windows-packaging.log
      - name: Probe mutex refusal, isolated install and bounded uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Resolve-Path "build/desktop-windows-packaging/Sesori-windows-${{ matrix.arch }}-$env:SESORI_WINDOWS_VERSION.exe"
          $install = Join-Path $env:RUNNER_TEMP 'Sesori isolated install'
          $shared = Join-Path $env:LOCALAPPDATA 'sesori'
          New-Item -ItemType Directory -Path $shared -Force | Out-Null
          Set-Content -Path (Join-Path $shared 'keep.txt') -Value 'preserve'
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          New-Item -Path $runKey -Force | Out-Null
          New-ItemProperty -Path $runKey -Name Sesori -Value 'preexisting-login-intent' -PropertyType String -Force | Out-Null
          $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$install`"")
          $installed = Start-Process -FilePath $package -ArgumentList $arguments -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "Install failed: $($installed.ExitCode)" }
          $currentUserSid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $runningMutexName = "Global\com.sesori.desktop.running.$currentUserSid"
          $mutex = [Threading.Mutex]::new($false, $runningMutexName)
          $blocked = Start-Process -FilePath $package -ArgumentList $arguments -Wait -PassThru
          $setupMutexExit = $blocked.ExitCode
          $mutex.Dispose()
          if ($setupMutexExit -eq 0) { throw 'Upgrade ignored running GUI marker' }
          $upgraded = Start-Process -FilePath $package -ArgumentList $arguments -Wait -PassThru
          if ($upgraded.ExitCode -ne 0) { throw "Upgrade failed: $($upgraded.ExitCode)" }
          if ((Get-ItemPropertyValue -Path $runKey -Name Sesori) -ne 'preexisting-login-intent') {
            throw 'Install or upgrade changed login intent'
          }
          python .github/scripts/package_desktop_windows.py verify-installed --bundle $install --arch '${{ matrix.arch }}' --version $env:SESORI_WINDOWS_VERSION |
            Set-Content -Encoding utf8 build/desktop-windows-packaging/installed-inventory.json
          if ($LASTEXITCODE -ne 0) { throw 'Installed payload verification failed' }
          $stagedRoot = (Resolve-Path 'build/desktop-bundle/bundle').Path
          $recordedPayload = Get-ChildItem $stagedRoot -File -Recurse | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath($stagedRoot, $_.FullName)
            $installedPath = Join-Path $install $relative
            if (-not (Test-Path $installedPath -PathType Leaf)) { throw "Installed payload missing: $relative" }
            $stagedHash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            $installedHash = (Get-FileHash $installedPath -Algorithm SHA256).Hash
            if ($stagedHash -ne $installedHash) { throw "Installed payload hash mismatch: $relative" }
            [PSCustomObject]@{ relativePath = $relative; sha256 = $stagedHash.ToLowerInvariant() }
          }
          $recordedPaths = [Collections.Generic.HashSet[string]]::new(
            [string[]]($recordedPayload | ForEach-Object { $_.relativePath }),
            [StringComparer]::OrdinalIgnoreCase
          )
          $unexpectedInstalled = Get-ChildItem $install -File -Recurse | Where-Object {
            $relative = [IO.Path]::GetRelativePath($install, $_.FullName)
            -not $recordedPaths.Contains($relative) -and $relative -notmatch '^unins[0-9]{3}\.(dat|exe|msg)$'
          }
          if ($unexpectedInstalled) {
            throw "Unexpected installed payload: $($unexpectedInstalled.FullName -join ', ')"
          }
          $unrecorded = Join-Path $install 'user-created-keep.txt'
          Set-Content -Path $unrecorded -Value 'unrecorded'
          $uninstaller = Join-Path $install 'unins000.exe'
          $mutex = [Threading.Mutex]::new($false, $runningMutexName)
          $blocked = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          $uninstallMutexExit = $blocked.ExitCode
          $mutex.Dispose()
          if ($uninstallMutexExit -eq 0) { throw 'Uninstall ignored running GUI marker' }
          $removed = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($removed.ExitCode -ne 0) { throw "Uninstall failed: $($removed.ExitCode)" }
          foreach ($payload in $recordedPayload) {
            if (Test-Path (Join-Path $install $payload.relativePath)) {
              throw "Recorded payload remains: $($payload.relativePath)"
            }
          }
          if ((Get-Content $unrecorded) -ne 'unrecorded') { throw 'Unrecorded file changed' }
          if (Get-ItemProperty -Path $runKey -Name Sesori -ErrorAction SilentlyContinue) { throw 'Login value remains after uninstall' }
          if ((Get-Content (Join-Path $shared 'keep.txt')) -ne 'preserve') { throw 'Shared sentinel changed' }
          @{
            architecture = '${{ matrix.arch }}'
            setupMutexExit = $setupMutexExit
            uninstallMutexExit = $uninstallMutexExit
            installedPayloadVerified = $true
            sameVersionUpgradeVerified = $true
            uninstallRemovedOnlyRecordedPayload = $true
            proofBoundary = 'Silent fixture: nonzero exits with mutex held and success without it; no diagnostic-specific refusal proof. Not interactive GUI, account, SmartScreen, signing, or product QA'
          } | ConvertTo-Json | Set-Content -Encoding utf8 build/desktop-windows-packaging/installer-probe.json
      - name: Upload private unsigned installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-packages-${{ matrix.arch }}
          path: build/desktop-windows-packaging/Sesori-windows-*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload qualification evidence, including partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-evidence-${{ matrix.arch }}
          path: |
            build/desktop-qualification/*.log
            build/desktop-bundle/build-source-changes.patch
            build/desktop-bundle/bundle/bridge/desktop-bundle.json
            build/desktop-windows-packaging/*.json
            build/desktop-windows-packaging/*.log
          if-no-files-found: warn
          retention-days: 14

  tooling:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s .github/scripts -p 'test_*desktop*.py'

  native-build:
    needs: tooling
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'native-builds'
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26-intel
            target: macos
            arch: x64
          - runner: macos-26
            target: macos
            arch: arm64
          - runner: windows-2025
            target: windows
            arch: x64
          - runner: windows-11-arm
            target: windows
            arch: arm64
          - runner: ubuntu-24.04
            target: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            target: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      # Keep dependency downloads outside the producer's clean source checkout.
      PUB_CACHE: ${{ github.workspace }}/../desktop-qualification-pub-cache
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}

      # Official pinned framework source bootstraps native Dart on all six hosts.
      # Windows/Linux ARM64 have no prepacked Flutter SDK for the current pin.
      # A missing native bootstrap or x64 fallback fails, rather than passing via emulation.
      - name: Bootstrap exact official Flutter revision
        env:
          SDK_DIR: ${{ runner.temp }}/desktop-qualification-flutter
        run: |
          set -euo pipefail
          mkdir -p build/desktop-qualification
          python .github/scripts/qualify_desktop.py bootstrap --arch '${{ matrix.arch }}' --sdk-dir "$SDK_DIR" \
            2>&1 | tee build/desktop-qualification/bootstrap.log

      - name: Select Xcode with Icon Composer support
        if: matrix.target == 'macos'
        run: echo 'DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer' >> "$GITHUB_ENV"

      - name: Install Linux native build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libsecret-1-dev libayatana-appindicator3-dev

      - name: Typecheck supported Sparkle lifecycle API
        if: matrix.target == 'macos'
        run: |
          set -euo pipefail
          cd build/desktop-qualification
          curl --fail --location --output Sparkle.tar.xz \
            https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz
          echo 'c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c  Sparkle.tar.xz' | shasum --algorithm 256 --check
          mkdir sparkle
          tar -xf Sparkle.tar.xz -C sparkle
          xcrun swiftc -typecheck -F sparkle ../../.github/scripts/probe_sparkle.swift \
            2>&1 | tee sparkle-api.log
          echo 'Sparkle 2.10.0 public API typecheck passed; runtime update behavior remains unverified.' >> sparkle-api.log

      - name: Resolve locked workspaces
        run: |
          set -euo pipefail
          (cd bridge && dart pub get --enforce-lockfile) 2>&1 | tee build/desktop-qualification/bridge-pub.log
          # Fresh source SDKs need Flutter to populate sky_engine before resolving SDK dependencies.
          (cd client && flutter pub get --enforce-lockfile) 2>&1 | tee build/desktop-qualification/client-pub.log

      - name: Build and stage the identity-bound native desktop bundle
        run: |
          set -euo pipefail
          (cd client/desktop && dart run tool/stage_desktop_bundle.dart \
            --build-number '${{ github.run_number }}' \
            --output '${{ github.workspace }}/build/desktop-qualification/staged') \
            2>&1 | tee build/desktop-qualification/bundle-build.log

      - name: Inspect staged native assets and relocated helper
        run: |
          python .github/scripts/qualify_desktop.py inspect --arch '${{ matrix.arch }}' \
            --bundle-dir 'build/desktop-qualification/staged/${{ matrix.target == 'macos' && 'Sesori.app' || 'bundle' }}'

      - name: Exercise relocated helper with isolated local fakes
        env:
          SESORI_E2E_REQUIRED: '1'
          SESORI_E2E_ARTIFACT_DIR: ${{ github.workspace }}/build/desktop-qualification/supervised-e2e
        run: |
          set -euo pipefail
          (cd bridge/app && dart test test/integration/supervised_e2e_test.dart --reporter expanded) \
            2>&1 | tee build/desktop-qualification/supervised-e2e.log

      - name: Preserve source diagnostics when qualification fails
        if: failure()
        run: |
          mkdir -p build/desktop-qualification
          git diff HEAD > build/desktop-qualification/failed-source-changes.patch
          {
            git status --short
            git diff --ignore-cr-at-eol --stat HEAD
            git ls-files --eol '*generated_plugin_registrant.*' '*generated_plugins.cmake' '*GeneratedPluginRegistrant.*'
            git config --show-origin --get core.autocrlf || echo 'core.autocrlf unset'
          } > build/desktop-qualification/failed-source-status.log

      - name: Upload qualification evidence, including partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-qualification-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            build/desktop-qualification/*.json
            build/desktop-qualification/*.log
            build/desktop-qualification/*.patch
            build/desktop-qualification/supervised-e2e/
            build/desktop-qualification/staged/build-source-changes.patch
            build/desktop-qualification/staged/**/desktop-bundle.json
          if-no-files-found: warn
          retention-days: 14
