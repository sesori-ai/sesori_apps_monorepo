name: Migrate macOS signing secrets

# Temporary migration bridge. Remove after environment-scoped consumers pass.
# Encrypt directly to GitHub's macos-signing public key; no plaintext artifact,
# admin token in Actions, credential rotation, signing, or release publication.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seal:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: macos-signing
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install sealed-box implementation before accessing credentials
        run: python -m pip install PyNaCl==1.6.2
      - name: Seal existing credentials for the destination environment
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from nacl.public import PublicKey, SealedBox

          names = (
              'MACOS_CERT_P12_BASE64', 'MACOS_CERT_PASSWORD',
              'MACOS_KEYCHAIN_PASSWORD', 'APPLE_ID', 'APPLE_APP_SPECIFIC_PASSWORD',
          )
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing source credential names: ' + ', '.join(missing))
          # Public key obtained from the destination environment's GitHub API.
          # Fixed recipient prevents dispatch inputs from redirecting credentials.
          key_id = '3380204578043523366'
          key = PublicKey(base64.b64decode('22Ifgh26/rjYjo8TK/uM8gq7LES6JMYooliKHJOE+nw='))
          box = SealedBox(key)
          payload = {
              'repository': 'sesori-ai/sesori_apps_monorepo',
              'environment': 'macos-signing',
              'key_id': key_id,
              'source_sha': os.environ['GITHUB_SHA'],
              'secrets': {
                  name: base64.b64encode(box.encrypt(os.environ[name].encode())).decode()
                  for name in names
              },
          }
          Path('sealed-macos-signing.json').write_text(json.dumps(payload) + '\n')
          print('Sealed five credentials for macos-signing; no plaintext exported.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-macos-signing
          path: sealed-macos-signing.json
          if-no-files-found: error
          retention-days: 1
