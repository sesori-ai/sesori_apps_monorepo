name: Migrate macOS signing secrets

# Temporary migration bridge. Remove after environment-scoped consumers pass.
# Encrypt directly to GitHub's macos-signing public key; no plaintext artifact,
# admin token in Actions, credential rotation, signing, or release publication.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seal:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Read repository source values, never same-named destination overrides.
    # The main-only condition above bounds this temporary bootstrap route.
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install sealed-box implementation before accessing credentials
        run: |
          # Exact binary-wheel hashes from PyPI; cover the entire dependency set.
          # Ubuntu 24.04 x64, CPython 3.13. No source builds or unlocked transitives.
          cat > /tmp/sealed-box-requirements.txt <<'LOCK'
          PyNaCl==1.6.2 --hash=sha256:c8a231e36ec2cab018c4ad4358c386e36eede0319a0c41fed24f840b1dac59f6
          cffi==2.0.0 --hash=sha256:c8d3b5532fc71b7a77c09192b4a5a200ea992702734a2e9279a37f2478236f26
          pycparser==2.23 --hash=sha256:e5c6e8d3fbad53479cab09ac03729e0a9faf2bee3db8208a550daf5af81a5934
          LOCK
          python -m pip install --require-hashes --only-binary=:all: -r /tmp/sealed-box-requirements.txt
          python - <<'PY'
          from nacl.public import PrivateKey, SealedBox
          key = PrivateKey.generate()
          assert SealedBox(key).decrypt(SealedBox(key.public_key).encrypt(b'migration-probe')) == b'migration-probe'
          print('Synthetic sealed-box roundtrip passed.')
          PY
      - name: Seal existing credentials for the destination environment
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from nacl.public import PublicKey, SealedBox

          names = (
              'MACOS_CERT_P12_BASE64', 'MACOS_CERT_PASSWORD',
              'MACOS_KEYCHAIN_PASSWORD', 'APPLE_ID', 'APPLE_APP_SPECIFIC_PASSWORD',
          )
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing source credential names: ' + ', '.join(missing))
          # Public key obtained from the destination environment's GitHub API.
          # Fixed recipient prevents dispatch inputs from redirecting credentials.
          key_id = '3380204578043523366'
          key = PublicKey(base64.b64decode('22Ifgh26/rjYjo8TK/uM8gq7LES6JMYooliKHJOE+nw='))
          box = SealedBox(key)
          payload = {
              'repository': 'sesori-ai/sesori_apps_monorepo',
              'environment': 'macos-signing',
              'key_id': key_id,
              'source_sha': os.environ['GITHUB_SHA'],
              'secrets': {
                  name: base64.b64encode(box.encrypt(os.environ[name].encode())).decode()
                  for name in names
              },
          }
          Path('sealed-macos-signing.json').write_text(json.dumps(payload) + '\n')
          print('Sealed five credentials for macos-signing; no plaintext exported.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sealed-macos-signing
          path: sealed-macos-signing.json
          if-no-files-found: error
          retention-days: 1
