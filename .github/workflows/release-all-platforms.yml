name: Release All Platforms

run-name: "release · build ${{ github.sha }}"

# Automatic internal release: normally runs per relevant main merge, uploads
# iOS to TestFlight and Android to the Play internal track, builds the
# 5-platform bridge archives, and — only when EVERYTHING succeeded
# (all-or-nothing) — pushes a `v<X>-internal.<N>` tag and rolls the single
# internal GitHub pre-release onto it (previous pre-release objects are deleted;
# their tags are kept forever as the build-number→commit map used by
# submit-release.yml).
#
# App Store Connect limits binary uploads in a rolling 24-hour window. Automatic
# runs stop at 18 completed internal releases, then an hourly run retries the
# latest still-unreleased relevant main commit after capacity returns. Manual
# dispatches deliberately bypass this admission guard.
#
# The bridge auto-updater ignores pre-releases, so the rolling internal
# pre-release never reaches end users — it serves internal testers and the
# future pre-release update channel.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    # Mobile-PRODUCT paths only (not blanket client/**) so future client/desktop
    # PRs never trigger a mobile or bridge release — release-safety invariant #3.
    paths:
      - 'client/app/**'
      - 'client/module_core/**'
      - 'client/module_auth/**'
      - 'client/module_prego/**'
      - 'client/pubspec.yaml'
      - 'client/pubspec.lock'
      - 'client/analysis_options.yaml'
      - 'client/Makefile'
      - 'shared/**'
      - 'bridge/**'

# Serial execution makes the tag-based admission count authoritative even when
# several merges arrive while another release is still running.
concurrency:
  group: release-all-${{ github.ref }}
  cancel-in-progress: false

env:
  INTERNAL_RELEASE_LIMIT: '18'

jobs:
  preflight:
    name: Version and release guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_release: ${{ steps.admission.outputs.should_release }}
    steps:
      - uses: actions/checkout@v6

      # Fail the WHOLE run (mobile and bridge) when the committed version was
      # already released/submitted: a `v<version>` tag is pushed by every beta
      # or production submit, so its existence means this version is taken and
      # a `tool/sync_versions.dart` bump PR must land before main can produce
      # new internal builds. Never auto-increment.
      - name: Verify versions are in sync and unreleased
        id: check
        run: |
          set -euo pipefail
          MOBILE_VERSION=$(awk '/^version:/{split($2,a,"+"); print a[1]; exit}' client/app/pubspec.yaml)
          BRIDGE_VERSION=$(awk '/^version:/{print $2; exit}' bridge/app/pubspec.yaml)
          if [[ -z "$MOBILE_VERSION" || -z "$BRIDGE_VERSION" ]]; then
            echo "::error::Could not parse versions (mobile: '$MOBILE_VERSION', bridge: '$BRIDGE_VERSION')."
            exit 1
          fi
          if [[ "$MOBILE_VERSION" != "$BRIDGE_VERSION" ]]; then
            echo "::error::Mobile ($MOBILE_VERSION) and bridge ($BRIDGE_VERSION) versions differ. Run tool/sync_versions.dart."
            exit 1
          fi

          TAG="v${MOBILE_VERSION}"
          PEELED=$(git ls-remote origin "refs/tags/${TAG}^{}" | awk '{print $1}')
          PLAIN=$(git ls-remote origin "refs/tags/${TAG}" | awk '{print $1}')
          EXISTING="${PEELED:-$PLAIN}"
          if [[ -n "$EXISTING" && "$EXISTING" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag ${TAG} already exists — version ${MOBILE_VERSION} was already submitted/released. Bump the version with tool/sync_versions.dart before merging further changes."
            exit 1
          fi

          echo "version=${MOBILE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version ${MOBILE_VERSION} is in sync and unreleased."

      - name: Admit automatic internal release
        id: admission
        run: |
          set -euo pipefail

          # An operator may intentionally request another build even when the
          # automatic rolling-window budget is exhausted.
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch bypasses automatic release admission."
            exit 0
          fi

          git fetch --force --tags origin

          skip_release() {
            local heading="$1"
            local reason="$2"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=${heading}::${reason}"
            {
              echo "## ${heading}"
              echo ""
              echo "${reason}"
              echo ""
              echo "No store build, bridge archive, tag, or pre-release was created."
            } >> "$GITHUB_STEP_SUMMARY"
          }

          # Re-running a successful automatic event must not create another
          # build for a commit that already has a complete internal release.
          EXISTING_TAG=$(git tag --points-at "$GITHUB_SHA" --list 'v*-internal.*' | head -n 1)
          if [[ -n "$EXISTING_TAG" ]]; then
            skip_release \
              "Internal release already complete" \
              "Commit \`${GITHUB_SHA}\` already has internal release tag \`${EXISTING_TAG}\`."
            exit 0
          fi

          # Scheduled runs exist only to catch up after quota deferral. Ignore
          # newer docs/tooling-only commits when no release-triggering product
          # path changed since the most recent complete internal release.
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            LATEST_TAG=$(git for-each-ref \
              --count=1 \
              --sort=-creatordate \
              --format='%(refname:short)' \
              'refs/tags/v*-internal.*')
            # Keep this path set synchronized with on.push.paths above.
            RELEASE_PATHS=(
              client/app
              client/module_core
              client/module_auth
              client/module_prego
              client/pubspec.yaml
              client/pubspec.lock
              client/analysis_options.yaml
              client/Makefile
              shared
              bridge
            )
            if [[ -n "$LATEST_TAG" ]] && \
              git diff --quiet "${LATEST_TAG}^{commit}" "$GITHUB_SHA" -- "${RELEASE_PATHS[@]}"; then
              skip_release \
                "No pending internal release" \
                "No release-triggering paths changed after \`${LATEST_TAG}\`."
              exit 0
            fi
          fi

          NOW=$(date -u +%s)
          CUTOFF=$((NOW - 86400))
          RELEASE_TIMES=$(git for-each-ref \
            --format='%(creatordate:unix)' \
            'refs/tags/v*-internal.*' | awk -v cutoff="$CUTOFF" '$1 >= cutoff')
          RECENT_RELEASES=$(printf '%s\n' "$RELEASE_TIMES" | awk 'NF { count++ } END { print count + 0 }')

          if (( RECENT_RELEASES >= INTERNAL_RELEASE_LIMIT )); then
            # Capacity returns once enough of the oldest tags leave the rolling
            # window to put the count below the limit.
            EXPIRATIONS_NEEDED=$((RECENT_RELEASES - INTERNAL_RELEASE_LIMIT + 1))
            CAPACITY_TAG_TIME=$(printf '%s\n' "$RELEASE_TIMES" | sort -n | awk \
              -v position="$EXPIRATIONS_NEEDED" 'NR == position { print; exit }')
            CAPACITY_EPOCH=$((CAPACITY_TAG_TIME + 86400))
            CAPACITY_AT=$(date -u -r "$CAPACITY_EPOCH" '+%Y-%m-%d %H:%M:%S UTC' 2>/dev/null || \
              date -u --date="@${CAPACITY_EPOCH}" '+%Y-%m-%d %H:%M:%S UTC')
            REASON="${RECENT_RELEASES} internal releases completed in the rolling 24-hour window; "
            REASON+="the automatic limit is ${INTERNAL_RELEASE_LIMIT}. The hourly retry can admit the latest relevant "
            REASON+="main commit after ${CAPACITY_AT}."
            skip_release "Internal release deferred" "$REASON"
            exit 0
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "Automatic release admitted (${RECENT_RELEASES}/${INTERNAL_RELEASE_LIMIT} completed in the rolling window)."

  next-build-number:
    name: Resolve aligned build number
    needs: preflight
    if: needs.preflight.outputs.should_release == 'true'
    uses: ./.github/workflows/_reusable-next-build-number.yml
    secrets:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

  ios:
    name: Deploy iOS to TestFlight
    needs: next-build-number
    uses: ./.github/workflows/_reusable-ios-testflight.yml
    with:
      runner: macos-latest
      build_number: ${{ needs.next-build-number.outputs.build_number }}
    secrets:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ITC_TEAM_ID: ${{ secrets.ITC_TEAM_ID }}

  android:
    name: Deploy Android to Internal Track
    needs: next-build-number
    uses: ./.github/workflows/_reusable-android-internal.yml
    with:
      runner: ubuntu-latest
      build_number: ${{ needs.next-build-number.outputs.build_number }}
    secrets:
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_PROPERTIES: ${{ secrets.ANDROID_PROPERTIES }}

  bridge:
    name: Build bridge (internal)
    needs: [preflight, next-build-number]
    uses: ./.github/workflows/_reusable-bridge-build.yml
    with:
      version: ${{ needs.preflight.outputs.version }}-internal.${{ needs.next-build-number.outputs.build_number }}
    secrets:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}

  # All-or-nothing: runs only when iOS, Android AND all five bridge targets
  # succeeded, so every internal tag maps to a complete set (both store builds
  # + all bridge binaries). On any failure nothing is tagged or published and
  # the rolling pre-release keeps pointing at the previous good build.
  finalize:
    name: Tag and roll internal pre-release
    runs-on: ubuntu-latest
    needs: [preflight, next-build-number, ios, android, bridge]
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.preflight.outputs.version }}
      BUILD_NUMBER: ${{ needs.next-build-number.outputs.build_number }}
    steps:
      - uses: actions/checkout@v6

      # The notes script is dependency-free pure Dart — a bare Dart SDK
      # installs in seconds, vs minutes for the asdf Flutter toolchain.
      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Download bridge artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: sesori-bridge-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: |
          find . -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 | sort -z | while IFS= read -r -d '' file; do
            sha256sum "$file" | awk -v name="$(basename "$file")" '{print $1 "  " name}'
          done > checksums.txt
          cat checksums.txt

      - name: Push internal tag
        id: tag
        run: |
          set -euo pipefail
          TAG="v${VERSION}-internal.${BUILD_NUMBER}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git ls-remote --tags origin "refs/tags/${TAG}")" ]; then
            echo "Tag ${TAG} already exists on origin — skipping"
          else
            git tag -a "$TAG" -m "Internal build ${BUILD_NUMBER} (v${VERSION}) sha=${GITHUB_SHA}"
            git push origin "refs/tags/${TAG}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          dart tool/generate_release_notes.dart \
            --repo "$GITHUB_REPOSITORY" \
            --to "$TAG" \
            --version "${VERSION}-internal.${BUILD_NUMBER}" \
            --output notes.md
          cat notes.md

      # Keep exactly ONE internal pre-release: delete previous internal
      # pre-release OBJECTS (their tags stay — submit-release.yml resolves
      # build numbers through them) before publishing the new one.
      - name: Roll internal pre-release
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName' \
            | { grep -E '^v.+-internal\.[0-9]+$' || true; } \
            | while read -r stale; do
                if [ "$stale" != "$TAG" ]; then
                  echo "Deleting previous internal pre-release $stale (tag kept)"
                  gh release delete "$stale" --yes
                fi
              done

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release for ${TAG} already exists — uploading assets idempotently"
            gh release upload "$TAG" artifacts/*.tar.gz artifacts/*.zip artifacts/checksums.txt --clobber
            gh release edit "$TAG" --prerelease --notes-file notes.md
          else
            gh release create "$TAG" \
              --prerelease \
              --verify-tag \
              --title "Internal v${VERSION}-internal.${BUILD_NUMBER}" \
              --notes-file notes.md \
              artifacts/*.tar.gz artifacts/*.zip artifacts/checksums.txt
          fi

      - name: Summary
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          {
            echo "## Internal Release"
            echo ""
            echo "- **Version**: \`${VERSION}-internal.${BUILD_NUMBER}\`"
            echo "- **Tag**: \`${TAG}\`"
            echo "- **iOS (TestFlight)** / **Android (internal track)**: build ${BUILD_NUMBER} (iOS next: ${{ needs.next-build-number.outputs.ios_next }}, Android next: ${{ needs.next-build-number.outputs.android_next }})"
            echo "- **Bridge pre-release**: rolled to \`${TAG}\` (5 platform archives + checksums)"
          } >> "$GITHUB_STEP_SUMMARY"
