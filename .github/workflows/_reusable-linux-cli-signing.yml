name: Linux CLI signing

on:
  workflow_call:
    inputs:
      release_tag:
        description: 'Existing public release to sign; omitted for the current run artifacts'
        type: string
        required: false
    secrets:
      LINUX_GPG_PRIVATE_KEY:
        required: false
      LINUX_GPG_PASSPHRASE:
        required: false

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-24.04
    environment: linux-signing
    timeout-minutes: 15
    steps:
      - name: Require trusted main workflow
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Linux signing requires main'; exit 1; }
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Download this run's native Linux archives
        if: inputs.release_tag == ''
        uses: actions/download-artifact@v4
        with:
          pattern: 'sesori-bridge-linux-{x64,arm64}'
          merge-multiple: true
          path: build/bridge-linux-signing/input
      - name: Download and verify existing public archives
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 .github/scripts/publish_bridge_linux_signatures.py download \
            --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --root build/bridge-linux-signing/input
      - name: Build signing tools without secrets
        run: |
          docker build --file .github/scripts/Dockerfile.linux-signing \
            --tag sesori-linux-signing .github/scripts
      - name: Sign unchanged archives and verify with public material
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
          LINUX_GPG_FINGERPRINT: ${{ vars.LINUX_GPG_FINGERPRINT }}
        run: |
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE/.github/scripts:/scripts:ro" \
            -v "$GITHUB_WORKSPACE/build/bridge-linux-signing:/artifacts" \
            -e LINUX_GPG_PRIVATE_KEY -e LINUX_GPG_PASSPHRASE -e LINUX_GPG_FINGERPRINT \
            sesori-linux-signing python3 /scripts/sign_bridge_linux.py \
              --root /artifacts/input --output /artifacts/signed
      - name: Upload signatures and private signing evidence
        uses: actions/upload-artifact@v4
        with:
          name: sesori-bridge-linux-signatures
          path: build/bridge-linux-signing/signed/*
          if-no-files-found: error
