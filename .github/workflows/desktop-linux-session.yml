name: Native Linux desktop sessions

# The existing qualification workflow owns manual dispatch and requires an explicit retained pair.
# Automatic tooling contracts never depend on finite-retention product artifacts.
on:
  workflow_call:
    inputs:
      previous_run:
        description: Successful signed Linux producer run before replacement (artifacts must still be retained)
        required: true
        type: string
      current_run:
        description: Successful signed Linux producer run after replacement (artifacts must still be retained)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: native-linux-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    strategy:
      fail-fast: false
      # These isolated jobs have no QA account or shared relay slot.
      max-parallel: 2
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x64
            desktop: gnome-wayland
          - runner: ubuntu-24.04-arm
            architecture: arm64
            desktop: kde-x11
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - name: Require explicit retained signed producer pair
        env:
          PREVIOUS_RUN: ${{ inputs.previous_run }}
          CURRENT_RUN: ${{ inputs.current_run }}
        run: |
          [[ "$PREVIOUS_RUN" =~ ^[1-9][0-9]*$ && "$CURRENT_RUN" =~ ^[1-9][0-9]*$ ]] || {
            echo 'Select two retained signed Linux producer runs; no default or latest substitution is allowed.'
            exit 1
          }
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.architecture }}
      - name: Verify focused tooling contracts
        run: |
          PYTHONPATH=.github/scripts python -m unittest \
            test_qualify_desktop_linux_session test_publish_desktop_linux
      - name: Install native session and build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libx11-dev libxi-dev dpkg-dev rpm gnupg \
            dbus-x11 python3-dbus python3-pyatspi gnome-keyring libsecret-tools \
            gnome-shell plasma-desktop plasma-workspace kwin-x11 \
            xvfb xauth wmctrl xdotool x11-utils imagemagick tesseract-ocr tesseract-ocr-eng mesa-utils
      # Release objects roll away by design. Bind QA to original signed producer
      # artifacts instead; do not change retention or recreate historical releases.
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.previous_run }}
          pattern: desktop-linux-*
          path: build/linux-session-producers/previous
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.current_run }}
          pattern: desktop-linux-*
          path: build/linux-session-producers/current
      - name: Verify unchanged signed producer inputs
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RUN: ${{ inputs.previous_run }}
          CURRENT_RUN: ${{ inputs.current_run }}
        run: |
          python .github/scripts/qualify_desktop_linux_session.py prepare \
            --previous "$PREVIOUS_RUN" --current "$CURRENT_RUN" --tooling-sha "$GITHUB_SHA" \
            --inputs build/linux-session-producers --output build/linux-session-inputs
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.inputs.outputs.previous_source }}
          path: .qa-previous
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.inputs.outputs.current_source }}
          path: .qa-current
          persist-credentials: false
      - name: Bootstrap the pinned native SDK
        run: |
          for source in .qa-previous .qa-current; do
            diff <(grep '^flutter ' .tool-versions) <(grep '^flutter ' "$source/.tool-versions")
          done
          python .github/scripts/qualify_desktop.py bootstrap \
            --arch '${{ matrix.architecture }}' --sdk-dir "$RUNNER_TEMP/linux-session-flutter"
      - name: Build nonshipping probes against each corresponding product source
        run: |
          for candidate in previous current; do
            (
              cd ".qa-$candidate/client"
              flutter pub get --enforce-lockfile
              cd desktop
              flutter build linux --release --no-pub \
                --target "$GITHUB_WORKSPACE/client/desktop/test/native/packaged_platform_probe.dart"
            )
            mkdir -p "build/linux-session-probes/$candidate"
            cp -a ".qa-$candidate/client/desktop/build/linux/${{ matrix.architecture }}/release/bundle/." \
              "build/linux-session-probes/$candidate/"
          done
      - name: Exercise native desktops, Secret Service and a genuine package replacement
        run: |
          # The user service directory precedes the system one. Once the driver stops its keyring,
          # libsecret must meet a genuinely absent Secret Service instead of auto-starting another.
          mkdir -p "$HOME/.local/share/dbus-1/services"
          printf '[D-BUS Service]\nName=org.freedesktop.secrets\nExec=/bin/false\n' \
            > "$HOME/.local/share/dbus-1/services/sesori-qa-absent-secret-service.service"
          dbus-run-session -- /usr/bin/python3 .github/scripts/qualify_desktop_linux_session.py exercise \
            --inputs build/linux-session-inputs --probes build/linux-session-probes \
            --desktop '${{ matrix.desktop }}' --architecture '${{ matrix.architecture }}' \
            --output build/linux-session-evidence
      # The remaining nominated rows run on this native CPU in their own pinned userspace.
      # The kernel and display stack are the runner's; packages, libraries and Secret Service are the distro's.
      - name: Upgrade and exercise Secret Service on native Debian 13 and Fedora 44
        env:
          # Same digests as the producer's install fixtures; the tooling test keeps them in step.
          DEBIAN_IMAGE: docker.io/library/debian@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1
          FEDORA_IMAGE: registry.fedoraproject.org/fedora@sha256:61beafd34111e1cb85fb49377ceadeee0a53622dbc20670ed8ca303f0e17ed9c
        run: |
          set -euo pipefail
          for row in "debian-13|deb|$DEBIAN_IMAGE" "fedora-44|rpm|$FEDORA_IMAGE"; do
            IFS='|' read -r name format image <<<"$row"
            docker pull --quiet "$image"
            [[ "$(docker run --rm "$image" uname -m)" == "$(uname -m)" ]] || {
              echo "$name container architecture differs from native host"; exit 1;
            }
            docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" "$image" \
              .github/scripts/qualify_desktop_linux_distro.sh "$format" "$PWD/build/linux-session-inputs" \
                "$PWD/build/linux-session-probes" '${{ matrix.architecture }}' \
                "$PWD/build/linux-session-evidence/$name" 2>&1 | tee "build/linux-session-evidence/$name.log"
          done
      - name: Replace the portable AppImage on native Arch Linux with a Plasma 6 tray host
        env:
          ARCH_X64_IMAGE: docker.io/library/archlinux@sha256:52dfbd5afb23a220d5ee92dafcb4c788d96c026ed04179890c23adef4c897fa0
          # Arch has no official ARM64 image. Import the community Arch Linux ARM rootfs only after its
          # build-system signature verifies against this pinned primary fingerprint.
          ARCH_ARM_SIGNER: 68B3537F39A313B3E574D06777193F152BDBE6A6
        run: |
          set -euo pipefail
          if [[ '${{ matrix.architecture }}' == x64 ]]; then
            image="$ARCH_X64_IMAGE"
            docker pull --quiet "$image"
          else
            rootfs="$RUNNER_TEMP/archlinuxarm"
            export GNUPGHOME="$rootfs/gnupg"
            install -d -m 700 "$GNUPGHOME"
            for file in ArchLinuxARM-aarch64-latest.tar.gz ArchLinuxARM-aarch64-latest.tar.gz.sig; do
              curl --fail --silent --show-error --location --retry 3 --output "$rootfs/$file" \
                "http://os.archlinuxarm.org/os/$file"
            done
            gpg --batch --keyserver hkps://keyserver.ubuntu.com --recv-keys "$ARCH_ARM_SIGNER"
            gpg --batch --status-fd 1 --verify "$rootfs/ArchLinuxARM-aarch64-latest.tar.gz.sig" \
              "$rootfs/ArchLinuxARM-aarch64-latest.tar.gz" | grep -q "^\[GNUPG:\] VALIDSIG $ARCH_ARM_SIGNER "
            sha256sum "$rootfs/ArchLinuxARM-aarch64-latest.tar.gz" | tee build/linux-session-evidence/archlinuxarm.sha256
            image=sesori-archlinuxarm
            docker import "$rootfs/ArchLinuxARM-aarch64-latest.tar.gz" "$image"
          fi
          [[ "$(docker run --rm "$image" uname -m)" == "$(uname -m)" ]] || {
            echo 'Arch container architecture differs from native host'; exit 1;
          }
          # GTK's glycin image loaders sandbox themselves with bwrap user namespaces, as on a real Arch desktop.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # The AppImage runtime mounts itself through FUSE; bwrap needs unshare, which the default profiles deny.
          docker run --rm --device /dev/fuse --cap-add SYS_ADMIN \
            --security-opt apparmor=unconfined --security-opt seccomp=unconfined \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" "$image" \
            bash .github/scripts/qualify_desktop_linux_appimage.sh "$PWD/build/linux-session-inputs" \
              "$PWD/build/linux-session-probes" '${{ matrix.architecture }}' \
              "$PWD/build/linux-session-evidence/arch" 2>&1 | tee build/linux-session-evidence/arch.log
      - name: Autostart the signed app through a genuine display-manager login
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          # The real login must meet the distro's normal Secret Service activation again.
          rm "$HOME/.local/share/dbus-1/services/sesori-qa-absent-secret-service.service"
          if [[ '${{ matrix.desktop }}' == gnome-wayland ]]; then
            sudo apt-get install --yes --no-install-recommends gdm3 gnome-session dbus-user-session
          else
            sudo apt-get install --yes --no-install-recommends sddm dbus-user-session xserver-xorg-core \
              xserver-xorg-video-fbdev xserver-xorg-video-modesetting xserver-xorg-input-libinput
          fi
          /usr/bin/python3 .github/scripts/qualify_desktop_linux_session.py login \
            --inputs build/linux-session-inputs --desktop '${{ matrix.desktop }}' \
            --architecture '${{ matrix.architecture }}' --output build/linux-session-evidence/login
      - name: Retain credential-free native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-session-${{ matrix.architecture }}-${{ matrix.desktop }}
          path: build/linux-session-evidence/
          if-no-files-found: warn
          retention-days: 14
